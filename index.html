function linksHtml(links){
  if(!links||!links.length) return '';
  return '<div><div class="label" style="margin-bottom:8px">Materials</div><div class="links">'+links.map(l=>
    '<a class="link'+(l.kind==='STUDY'?' study':l.kind==='REVIEW'?' review':'')+'" href="'+esc(l.url)+'"'+(/^https?:/.test(l.url)?' target="_blank" rel="noopener"':'')+'><span class="kind">'+esc(l.kind||'LINK')+'</span><span>'+esc(l.label)+'</span><span class="arrow">↗</span></a>').join('')+'</div></div>';
}

const missionOpen={}; // remembers an expanded checklist while the page is open; starts collapsed
function openTask(id){
  const t=allTasks().find(x=>x.id===id); if(!t) return;
  const gone=isDeleted(t);
  const s=st(id), steps=t.steps||[]; s.steps=s.steps||[];
  const c=countdown(t);
  const ck=steps.filter((_,i)=>s.steps[i]).length;
  let h='<div class="m-head" style="--c:'+col(t.subject)+'"><button class="close" type="button" data-close aria-label="Close">×</button>'+
    '<div class="tags"><span class="tag subj" style="--c:'+col(t.subject)+'">'+esc((SUBJECTS[t.subject]||SUBJECTS.home).name)+'</span>'+(t.teacher?'<span class="tag">'+esc(t.teacher)+'</span>':'')+'<span class="count '+c.cls+'">'+esc(c.txt)+'</span></div>'+
    '<h2 id="mTitle">'+esc(t.title)+'</h2>'+
    '<div class="sub">'+(t.due?'Due '+esc(fmt(t.due,{weekday:'long',month:'long',day:'numeric'}))+(t.time?' at '+esc(t.time):''):'No due date yet')+(t.turnIn?' · '+esc(t.turnIn):'')+'</div></div>';
  h+='<div class="m-body">';
  if(t.wip) h+='<a class="wip" href="'+esc(t.wip.url)+'" target="_blank" rel="noopener"><span class="wip-tag">Work in progress</span><span class="wip-name">'+esc(t.wip.label)+'</span><span class="wip-go">Open ↗</span></a>';
  h+=linksHtml(t.links);
  if(t.desc) h+='<p>'+esc(t.desc)+'</p>';
  if(t.note) h+='<div class="note">'+esc(t.note)+'</div>';
  if(steps.length){
    h+='<details class="mission" id="mission"'+(missionOpen[id]?' open':'')+'><summary><span class="chev" aria-hidden="true">▸</span><span class="label">Mission steps</span><span class="mono" style="font-size:12px;margin-left:auto" id="stepCount">'+ck+'/'+steps.length+'</span><span class="minibar mission-bar"><i id="stepBar" style="width:'+(ck/steps.length*100)+'%"></i></span></summary><ul class="steps">'+
      steps.map((x,i)=>'<li><label class="'+(s.steps[i]?'ck':'')+'" for="step-'+id+'-'+i+'"><input type="checkbox" id="step-'+id+'-'+i+'" data-step="'+i+'" '+(s.steps[i]?'checked':'')+'><span>'+esc(x)+'</span></label></li>').join('')+'</ul></details>';
  }
  if(t.rubric) h+='<div><div class="label" style="margin-bottom:6px">Rubric (/16)</div><div class="rubric">'+t.rubric.map(r=>'<div><span>'+esc(r[0])+'</span><span class="mono">'+esc(r[1])+'</span></div>').join('')+'</div></div>';
  h+='</div><div class="m-foot">';
  if(gone){
    h+='<div class="delbox"><span>Deleted on '+esc(fmt(store.deleted[id]))+'. Its progress is saved and comes back when you restore it.</span></div><div class="row"><button class="btn primary" type="button" data-restore>Restore assignment</button><button class="btn" type="button" data-backlist>Back to deleted list</button></div></div>';
    $('#mContent').innerHTML=h; if(!modal.open) modal.showModal();
    const mis0=modal.querySelector('#mission'); if(mis0) mis0.querySelectorAll('input').forEach(i=>i.disabled=true);
    modal.querySelector('[data-restore]').onclick=()=>restoreTask(id,true);
    modal.querySelector('[data-backlist]').onclick=openDeleted;
    return;
  }
  if(t.turnedIn && !s.done){
    h+='<div class="donebox">✓ <span>Turned in <b>on Google Classroom</b>'+(t.turnedIn!==true?' on '+esc(fmt(t.turnedIn)):'')+' · synced from Classroom</span></div>';
  } else if(isDone(t)){
    h+='<div class="donebox">✓ <span>Completed <b>'+(s.how==='classroom'?'on Google Classroom':'at school')+'</b>'+(s.at?' on '+esc(fmt(s.at)):'')+(s.early?' · finished early':'')+'</span></div><div class="row"><button class="btn small" type="button" data-undo>Mark as not done</button></div>';
  } else {
    h+='<div class="label">Finished it? Choose how:</div><div class="row"><button class="btn good" type="button" data-done="school">Done at school</button><button class="btn primary" type="button" data-done="classroom">Submitted on Classroom</button></div>';
  }
  h+='<div class="row"><label class="label" for="dueEdit" style="align-self:center">'+(t.due?'Change due date':'Set due date')+'</label><input type="date" id="dueEdit" value="'+(t.due||'')+'" style="font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">'+(t.custom?'<button class="btn small del" type="button" data-del>Delete</button>':'<span class="from-cr">From Google Classroom</span>')+'</div>';
  h+='</div>';
  $('#mContent').innerHTML=h;
  if(!modal.open) modal.showModal();

  const mis=modal.querySelector('#mission'); if(mis) mis.ontoggle=()=>{ missionOpen[id]=mis.open; };
  modal.querySelectorAll('[data-step]').forEach(cb=>cb.onchange=()=>{
    s.steps[+cb.dataset.step]=cb.checked; save();
    cb.closest('label').classList.toggle('ck',cb.checked);
    const n=steps.filter((_,i)=>s.steps[i]).length;
    $('#stepCount').textContent=n+'/'+steps.length; $('#stepBar').style.width=(n/steps.length*100)+'%';
    if(cb.checked) toast(n===steps.length?'All steps done! Now mark it complete 🚀':'Step done · '+(steps.length-n)+' to go');
    renderAll();
  });
  modal.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
    const early=t.due?daysUntil(t.due)>=1:false;
    Object.assign(s,{done:true,how:b.dataset.done,at:ymd(today()),early});
    save(); boom(); toast(early?'Done early. Great work! 🎉':'Done. Great work! 🎉'); openTask(id); renderAll();
  });
  const u=modal.querySelector('[data-undo]'); if(u) u.onclick=()=>{ delete s.done; delete s.how; delete s.at; delete s.early; save(); openTask(id); renderAll(); };
  $('#dueEdit').onchange=e=>{
    const v=e.target.value||null;
    if(t.custom){ const c=store.custom.find(x=>x.id===id); c.due=v; } else store.dueOverride[id]=v;
    save(); openTask(id); renderAll(); toast(v?'Due date set':'Due date cleared');
  };
  const del=modal.querySelector('[data-del]'); if(del) del.onclick=()=>{
    if(del.dataset.sure){ store.deleted[id]=ymd(today()); save(); modal.close(); renderAll(); toast('Moved to Deleted. You can restore it any time'); }
    else { del.dataset.sure='1'; del.textContent='Tap again to delete'; }
  };
}

function restoreTask(id, reopen){
  delete store.deleted[id]; save(); renderAll(); toast('Restored with all its progress');
  if(reopen) openTask(id); else if(deletedTasks().length) openDeleted(); else modal.close();
}
function openDeleted(){
  const list=deletedTasks();
  let h='<div class="m-head"><button class="close" type="button" data-close aria-label="Close">×</button><h2 id="mTitle">Deleted assignments</h2><div class="sub">Restoring brings back everything: checked steps, done marks and due dates.</div></div><div class="m-body">';
  if(!list.length) h+='<div class="empty">Nothing deleted.</div>';
  else h+='<div class="items">'+list.map(t=>{
    const s=st(t.id), n=(t.steps||[]).length, ck=(s.steps||[]).filter(Boolean).length;
    const prog=isDone(t)?'Done':n?ck+'/'+n+' steps':'Not started';
    return '<div class="del-row" style="--c:'+col(t.subject)+'"><span class="sw"></span><div class="del-info"><button type="button" class="del-title" data-view="'+esc(t.id)+'">'+esc(t.title)+'</button><div class="m">'+esc((SUBJECTS[t.subject]||SUBJECTS.home).name)+(t.due?' · due '+esc(fmt(t.due)):'')+' · '+esc(prog)+' · deleted '+esc(fmt(store.deleted[t.id]))+'</div></div><button class="btn small primary" type="button" data-restore-id="'+esc(t.id)+'">Restore</button></div>';
  }).join('')+'</div>';
  h+='</div>';
  $('#mContent').innerHTML=h; if(!modal.open) modal.showModal();
  modal.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openTask(b.dataset.view));
  modal.querySelectorAll('[data-restore-id]').forEach(b=>b.onclick=()=>restoreTask(b.dataset.restoreId,false));
}
$('#deletedBtn').onclick=openDeleted;

/* ---------- What's new pop-up ---------- */
const NEWS_DAYS = 3;
const NEWS_ICON = {announcement:'📣', assignment:'📝', material:'📎', event:'📅', done:'✅'};
function newsList(){
  const items = (typeof NEWS!=='undefined' && Array.isArray(NEWS)) ? NEWS : [];
  return items.filter(n=>n.date && daysUntil(n.date) > -NEWS_DAYS && daysUntil(n.date) <= 0).sort((a,b)=>b.date.localeCompare(a.date));
}
const newsSeen = () => store.newsSeen || '';
function newsUnseen(){ return newsList().filter(n=>n.date > newsSeen() || !(store.newsIds||[]).includes(n.id)); }
function renderNewsTab(){
  const tab=$('#newsTab'); if(!tab) return;
  const list=newsList(), un=newsUnseen().length;
  tab.hidden = list.length===0;
  const c=$('#newsCount'); c.textContent = un || list.length; c.classList.toggle('zero', !un);
  tab.setAttribute('aria-label', "What's new: "+list.length+' items'+(un?', '+un+' new':''));
}
function openNewsTarget(n){
  if(!n.open) return;
  if(/^https?:/.test(n.open)){ window.open(n.open,'_blank','noopener'); return; }
  const ev=EVENTS.find(e=>e.id===n.open);
  closeNews(false);
  setTimeout(()=>{ if(ev) openEvent(ev); else if(tasks().some(t=>t.id===n.open)) openTask(n.open); }, 60);
}
function openNews(){
  const list=newsList(), unseen=new Set(newsUnseen().map(n=>n.id));
  const byDay={}; list.forEach(n=>{ (byDay[n.date]=byDay[n.date]||[]).push(n); });
  const dayName=d=>{ const k=daysUntil(d); return k===0?'Today':k===-1?'Yesterday':fmt(d,{weekday:'long',month:'short',day:'numeric'}); };
  let h='';
  if(!list.length) h='<div class="news-empty">Nothing new in the last 3 days. You’re all caught up!</div>';
  Object.keys(byDay).sort().reverse().forEach(d=>{
    h+='<div class="news-sec"><div class="label">'+esc(dayName(d))+'</div>'+byDay[d].map(n=>
      '<button type="button" class="news-item k-'+esc(n.kind)+'" data-news="'+esc(n.id)+'"><span class="news-ico" aria-hidden="true">'+(NEWS_ICON[n.kind]||'•')+'</span><span><span class="nt">'+esc(n.title)+(unseen.has(n.id)?'<span class="news-new">NEW</span>':'')+'</span><div class="nd">'+esc(n.detail||'')+'</div></span><span class="nw">'+(n.open?'Open ›':'')+'</span></button>').join('')+'</div>';
  });
  const soon=[...tasks().filter(t=>!isDone(t)&&t.due&&daysUntil(t.due)>=0&&daysUntil(t.due)<=3).map(t=>({t:t.title,d:t.due})), ...EVENTS.filter(e=>daysUntil(e.date)>=0&&daysUntil(e.date)<=3).map(e=>({t:e.title,d:e.date}))].sort((a,b)=>a.d.localeCompare(b.d));
  if(soon.length) h+='<div class="news-sec"><div class="label">Coming up in the next 3 days</div><div class="note">'+soon.map(s=>'<b>'+esc(fmt(s.d,{weekday:'short',month:'short',day:'numeric'}))+'</b> · '+esc(s.t)).join('<br>')+'</div></div>';
  $('#newsBody').innerHTML=h;
  $('#newsSub').textContent = unseen.size ? unseen.size+' new since you last looked' : 'You’ve seen everything here';
  $('#newsBody').querySelectorAll('[data-news]').forEach(b=>b.onclick=()=>openNewsTarget(list.find(n=>n.id===b.dataset.news)));
  const d=$('#newsModal'); if(!d.open) d.showModal();
}
function closeNews(animate=true){
  const d=$('#newsModal'); if(!d.open) return;
  // mark everything as seen
  store.newsIds=[...new Set([...(store.newsIds||[]), ...newsList().map(n=>n.id)])].slice(-100);
  store.newsSeen=ymd(today()); save();
  const tab=$('#newsTab'); renderNewsTab(); tab.hidden=newsList().length===0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!animate||reduce||tab.hidden||!d.animate){ d.close(); return; }
  const a=d.getBoundingClientRect(), b=tab.getBoundingClientRect();
  const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2);
  d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale(.08)',opacity:.2}],{duration:420,easing:'cubic-bezier(.5,0,.75,0)'}).onfinish=()=>{ d.close(); tab.classList.remove('pulse'); void tab.offsetWidth; tab.classList.add('pulse'); };
}
function initNews(){
  renderNewsTab();
  $('#newsTab').onclick=openNews;
  $('#newsClose').onclick=()=>closeNews(true);
  $('#newsGotIt').onclick=()=>closeNews(true);
  $('#newsModal').addEventListener('cancel',e=>{ e.preventDefault(); closeNews(true); });
  $('#newsModal').addEventListener('click',e=>{ if(e.target===$('#newsModal')) closeNews(true); });
  // Pop up once per visit (each sign-in / new browser session) when there is anything in the last 3 days.
  let shown=false; try{ shown=sessionStorage.getItem('ql-news-shown')==='1'; sessionStorage.setItem('ql-news-shown','1'); }catch(e){}
  if(!shown && newsList().length) setTimeout(openNews, 500);
}

/* ---------- Toast & confetti ---------- */
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }
function boom(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const colors=['#E9A23B','#0E8A8C','#D6452A','#8A4FD1','#2563C9','#2E9E5B'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:colors[Math.random()*colors.length|0],a:Math.random()*6,s:(Math.random()-.5)*.4}));
  let f=0; (function step(){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(++f<120) requestAnimationFrame(step); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

/* ---------- Screens: Quest Log <-> French Trainer ---------- */
function showScreen(name){
  $('#questApp').hidden=name!=='quest'; $('#trainerApp').hidden=name!=='french'; $('#rootsApp').hidden=name!=='roots'; $('#voiceApp').hidden=name!=='voice'; $('#mathApp').hidden=name!=='math'; $('#fracApp').hidden=name!=='fractions'; $('#reviewApp').hidden=!name.startsWith('papa-');
  if(modal.open) modal.close();
  if(name==='quest') renderAll();
  if(name.startsWith('papa-')) renderReview(name.slice(5));
  if(name==='roots' && window.ROOTS) ROOTS.show();
  if(name==='voice' && window.VOICE) VOICE.show();
  if(name==='math' && window.MATH) MATH.show();
  if(name==='fractions' && window.FRAC) FRAC.show();
  window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href="#french"],a[href="#roots"],a[href="#voice"],a[href="#math"],a[href="#fractions"],a[href="#quest"],a[href^="#papa-"]'); if(!a) return;
  e.preventDefault(); showScreen(a.getAttribute('href').slice(1));
});

function renderReview(key){
  const R=REVIEWS[key], box=$('#reviewBody'); if(!R){ box.innerHTML='<p>Review not found.</p>'; return; }
  const s=st(R.task); s.review=s.review||{};
  const all=R.slides.flatMap(sl=>sl.fix.map((_,i)=>sl.n+'-'+i)), done=all.filter(k=>s.review[k]).length;

function qGram(g,r){ return {kind:"mc",sec:"Grammar",prompt:esc(g.q).replace("___",'<span style="display:inline-block;min-width:48px;border-bottom:2px solid var(--bleu)">&nbsp;</span>'),opts:shuffle(g.o,r),a:g.a,why:g.why}; }
function qComp(s,r){ const full=s.s.replace("___",s.a); const others=shuffle([...new Set(SENT.filter(x=>x.en!==s.en).map(x=>x.en))],r).slice(0,3); return {kind:"mc",sec:"Understand the sentence",prompt:'What does this mean?<br><span class="fr">'+esc(full)+'</span>',say:full,opts:shuffle([s.en,...others],r),a:s.en,why:full+" = "+s.en}; }
function qDlg(d,r){ return {kind:"mc",sec:"Conversation",prompt:esc(d.q),opts:shuffle([d.a,...d.d],r),a:d.a,why:"Best answer: "+d.a}; }
const correct=(q,ans)=> q.kind==="type" ? q.accept.some(x=>norm(x)===norm(ans)) : ans===q.a;
function wordFor(q){ if(q.word) return q.word; if(q.wordFr) return VOC.find(w=>norm(w.fr)===norm(q.wordFr)); return null; }

function buildTest(seed){
  const r=rng(seed);
  const words=shuffle(VOC,r), typeable=shuffle(VOC.filter(w=>!w.noType),r);
  const used=new Set(); const take=(arr,n)=>{const out=[];for(const w of arr){if(!used.has(w.fr)){used.add(w.fr);out.push(w);} if(out.length===n)break;} return out;};
  const sents=shuffle(SENT,r);
  return [
    ...take(words,6).map(w=>qFrEn(w,r)),
    ...take(words,4).map(w=>qEnFr(w,r)),
    ...take(typeable,4).map(w=>qType(w)),
    ...sents.slice(0,4).map(s=>qFill(s,r)),
    ...shuffle(GRAM,r).slice(0,3).map(g=>qGram(g,r)),
    ...sents.slice(4,6).map(s=>qComp(s,r)),
    ...shuffle(DLG,r).slice(0,2).map(d=>qDlg(d,r))
  ];
}

/* ================= FLASHCARDS ================= */
let fcSet=0, fcDir="fe", fcQueue=[], fcIdx=0, fcStats={k:0,n:0};
function buildQueue(){
  let pool=VOC.filter(w=>fcSet===0||w.set===fcSet);
  let due=pool.filter(isDue);
  if(fcSet===0) due=due.filter(w=>ws(w).seen).concat(due.filter(w=>!ws(w).seen).slice(0,8));
  if(!due.length && fcSet!==0) due=pool.slice().sort((a,b)=>ws(a).b-ws(b).b);
  fcQueue=shuffle(due).slice(0,12); fcIdx=0; fcStats={k:0,n:0};
}
function renderCards(){
  root.querySelectorAll("#setSeg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.set===fcSet));
  root.querySelectorAll("#dirSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dir===fcDir));
  const area=$("#fcArea");
  if(fcIdx>=fcQueue.length){
    area.innerHTML='<div class="stack" style="text-align:center;padding:30px 0"><h2>'+(fcQueue.length?"Round done! 🎉":"Nothing due right now ✓")+'</h2><p class="muted" style="margin:0">'+(fcQueue.length?"You knew "+fcStats.k+" of "+fcQueue.length+". Missed words come back sooner.":"Your brain needs time between reviews. Come back tomorrow, or try Practice.")+'</p><div class="row" style="justify-content:center"><button class="btn primary" type="button" id="again">Another round</button><button class="btn" type="button" data-show="practice">Go to Practice</button></div></div>';
    $("#again").onclick=()=>{buildQueue(); if(!fcQueue.length){fcQueue=shuffle(VOC.filter(w=>fcSet===0||w.set===fcSet)).slice(0,10);} renderCards();};
    return;
  }
  const w=fcQueue[fcIdx], s=ws(w);
  const front=fcDir==="fe"?'<div><div class="big">'+esc(w.fr)+'</div><div class="hint">Say it, remember it, then tap to flip</div></div>':'<div><div class="big" style="font-size:clamp(26px,5vw,40px)">'+esc(w.en[0])+'</div><div class="hint">What\'s the French? Say it, then tap to flip</div></div>';
  const back='<div><div class="big" style="font-size:clamp(24px,5vw,38px)">'+esc(fcDir==="fe"?w.en.slice(0,3).join(" / "):w.fr)+'</div><div class="hook">💡 '+esc(w.hook)+'</div></div>';
  area.innerHTML='<div class="row" style="justify-content:space-between;margin-top:14px"><span class="mono muted" style="font-size:13px">Card '+(fcIdx+1)+' of '+fcQueue.length+' · Set '+w.set+'</span><span class="row" style="gap:8px"><span class="boxes" title="Level '+s.b+' of 4">'+[1,2,3,4].map(i=>'<i class="'+(s.seen&&s.b>=i?"on":"")+'"></i>').join("")+'</span>'+spk(w.fr)+'</span></div>'+
    '<div class="card" id="card"><div class="card-in" tabindex="0" role="button" aria-label="Flip card"><div class="face front">'+front+'</div><div class="face back">'+back+'</div></div></div>'+
    '<div class="row" style="justify-content:center;margin-top:16px" id="fcBtns"><button class="btn primary" type="button" id="flipBtn">Flip card</button></div>';
  const flip=()=>{ $("#card").classList.add("flip"); if(fcDir==="ef") say(w.fr);
    $("#fcBtns").innerHTML='<button class="btn bad" type="button" id="nope">Not yet</button><button class="btn good" type="button" id="yep">I knew it!</button>';
    $("#nope").onclick=()=>next(false); $("#yep").onclick=()=>next(true); };
  const next=ok=>{ grade(w,ok); fcStats.n++; if(ok)fcStats.k++; if(!ok) fcQueue.push(w); save(); fcIdx++; renderHeader(); renderCards(); };
  $("#card").onclick=e=>{ if(!e.target.closest("[data-say]")) flip(); };
  $("#card .card-in").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();} };
  $("#flipBtn").onclick=flip;
}

/* ================= QUESTION UI ================= */
function qHtml(q,i,withNum){
  let h='<div class="q" id="q'+i+'">'+(withNum?'<span class="num">Q'+(i+1)+'</span>':'')+'<div class="prompt">'+q.prompt+' '+(q.say?spk(q.say):"")+'</div>'+(q.sub?'<div class="muted" style="font-size:13.5px">'+esc(q.sub)+'</div>':'');
  if(q.kind==="mc") h+='<div class="opts">'+q.opts.map(o=>'<button type="button" class="opt" data-q="'+i+'" data-v="'+esc(o)+'" aria-pressed="false">'+esc(o)+'</button>').join("")+'</div>';
  else h+='<input type="text" id="in'+i+'" data-q="'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in English">';
  return h+'<div class="fb" hidden></div></div>';
}
function showFeedback(q,i,ans){
  const box=$("#q"+i), ok=correct(q,ans);
  box.classList.add(ok?"right":"wrong");
  box.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.dataset.v===q.a) b.classList.add("right"); else if(b.dataset.v===ans) b.classList.add("wrong"); });
  const inp=box.querySelector("input"); if(inp) inp.disabled=true;
  const fb=box.querySelector(".fb"); fb.hidden=false; fb.className="fb "+(ok?"right":"wrong");
  fb.innerHTML=(ok?"<b>Correct!</b> ":"<b>Answer: "+esc(q.a)+"</b>. ")+esc(q.why||"");
  return ok;
}

/* ================= PRACTICE ================= */
let pr=null, streak=0;
function newRound(){
  const weak=VOC.slice().sort((a,b)=>(ws(a).seen?ws(a).b:1.5)-(ws(b).seen?ws(b).b:1.5)+ (Math.random()-.5)*2);
  const qs=[]; let wi=0;
  for(let k=0;k<10;k++){
    const t=["fe","fe","ef","type","fill","gram","comp","dlg"][Math.floor(Math.random()*8)];
    const w=weak[wi++%weak.length];
    if(t==="fe") qs.push(qFrEn(w,Math.random));
    else if(t==="ef") qs.push(qEnFr(w,Math.random));
    else if(t==="type") qs.push(w.noType?qFrEn(w,Math.random):qType(w));
    else if(t==="fill") qs.push(qFill(SENT[Math.floor(Math.random()*SENT.length)],Math.random));
    else if(t==="gram") qs.push(qGram(GRAM[Math.floor(Math.random()*GRAM.length)],Math.random));
    else if(t==="comp") qs.push(qComp(SENT[Math.floor(Math.random()*SENT.length)],Math.random));
    else qs.push(qDlg(DLG[Math.floor(Math.random()*DLG.length)],Math.random));
  }
  pr={qs,i:0,right:0};
}
function renderPractice(){
  if(!pr) newRound();
  $("#streak").textContent="🔥 "+streak+(S.streakBest?" · best "+S.streakBest:"");
  const area=$("#prArea");
  if(pr.i>=pr.qs.length){
    area.innerHTML='<div class="stack" style="text-align:center;padding:24px 0"><h2>'+pr.right+' / 10</h2><p class="muted" style="margin:0">'+(pr.right>=9?"Expert level! Try a mock test.":pr.right>=7?"Strong! One more round to lock it in.":"Keep going. Every miss makes the next try easier.")+'</p><div class="row" style="justify-content:center"><button class="btn primary" type="button" id="prAgain">New round</button><button class="btn" type="button" data-show="tests">Mock tests</button></div></div>';
    $("#prAgain").onclick=()=>{pr=null; renderPractice();}; return;
  }
  const q=pr.qs[pr.i];
  area.innerHTML='<div class="mono muted" style="font-size:13px;margin-bottom:8px">Question '+(pr.i+1)+' of 10 · '+esc(q.sec)+'</div>'+qHtml(q,"p")+'<div class="row" style="margin-top:12px"><button class="btn primary" type="button" id="prNext" hidden>Next →</button></div>';
  const done=ans=>{ const ok=showFeedback(q,"p",ans); const w=wordFor(q); if(w) grade(w,ok);
    if(ok){pr.right++;streak++; if(streak>S.streakBest)S.streakBest=streak; if(streak%5===0) toast("🔥 "+streak+" in a row!");} else streak=0;
    save(); renderHeader(); $("#streak").textContent="🔥 "+streak+" · best "+S.streakBest; $("#prNext").hidden=false; $("#prNext").focus(); };
  area.querySelectorAll(".opt").forEach(b=>b.onclick=()=>done(b.dataset.v));
  const inp=$("#inp"); if(inp){ inp.focus(); area.querySelector(".row").insertAdjacentHTML("afterbegin",'<button class="btn" type="button" id="chk">Check</button>'); const go=()=>{ if(!inp.value.trim())return; $("#chk").remove(); done(inp.value); }; $("#chk").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();}; }
  $("#prNext").onclick=()=>{pr.i++; renderPractice();};
}

/* ================= MOCK TESTS ================= */
function renderTestMenu(){
  $("#testMenu").hidden=false; $("#testArea").hidden=true;
  const cards=[[1,"Mock Test 1","Target 80%+"],[2,"Mock Test 2","Target 80%+"],[3,"Mock Test 3","Target 90%+ (expert)"],[0,"Surprise test","New random questions every time"]];
  $("#testCards").innerHTML=cards.map(([n,t,d])=>{const r=S.tests[n]; return '<button class="test-card" type="button" data-test="'+n+'"><span class="label">25 questions · about 15 min</span><h3>'+t+'</h3><span class="muted" style="font-size:14px">'+d+'</span><span class="mono" style="font-size:13px">'+(r?"Best "+r.best+"% · tries "+r.tries:"Not tried yet")+'</span></button>';}).join("");
  root.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>startTest(+b.dataset.test));
}
function level(p){ return p>=80?["Level 4","Expert! Well beyond the standard."]:p>=70?["Level 3","Meets the standard. Push for Level 4!"]:p>=60?["Level 2","Getting there. Review your misses."]:p>=50?["Level 1","Keep practising with flashcards."]:["Not yet","Go back to flashcards, then retry."]; }
let curTest=null;
function startTest(n){
  $("#testMenu").hidden=true; const area=$("#testArea"); area.hidden=false;
  const qs=buildTest(n===0?Date.now():n*7919); curTest={n,qs,answers:{}};
  let html='<div class="row" style="justify-content:space-between"><button class="btn small" type="button" id="tBack">← All tests</button><span class="mono muted" id="tProg">0 / 25 answered</span></div><h2 style="font-size:24px">'+(n?"Mock Test "+n:"Surprise test")+'</h2>';
  let sec="";
  qs.forEach((q,i)=>{ if(q.sec!==sec){sec=q.sec; html+='<div class="section-h"><h3>'+esc(sec)+'</h3></div>';} html+=qHtml(q,"t"+i,true).replace('<span class="num">Q'+("t"+i+1)+'</span>','<span class="num">Q'+(i+1)+'</span>'); });
  html+='<div class="row"><button class="btn primary" type="button" id="submitT">Submit test</button><span class="muted" id="submitMsg" style="font-size:14px"></span></div>';
  area.innerHTML=html; window.scrollTo({top:0});
  const prog=()=>$("#tProg").textContent=Object.values(curTest.answers).filter(v=>String(v).trim()).length+" / 25 answered";
  qs.forEach((q,i)=>{ const box=$("#qt"+i); box.querySelector(".num").textContent="Q"+(i+1);
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ box.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b)); curTest.answers[i]=b.dataset.v; prog(); });
    const inp=box.querySelector("input"); if(inp) inp.oninput=()=>{curTest.answers[i]=inp.value; prog();};
  });
  $("#tBack").onclick=renderTestMenu;
  let armed=false;
  $("#submitT").onclick=()=>{
    const left=25-Object.values(curTest.answers).filter(v=>String(v).trim()).length;
    if(left&&!armed){ armed=true; $("#submitMsg").textContent=left+" unanswered. Tap Submit again to finish anyway."; return; }
    gradeTest();
  };
}
function gradeTest(){
  const {n,qs,answers}=curTest; let right=0; const missed=[];
  qs.forEach((q,i)=>{ const ans=answers[i]??""; const ok=showFeedback(q,"t"+i,ans); if(ok) right++; else missed.push(i);
    $("#qt"+i).querySelectorAll(".opt").forEach(b=>b.onclick=null);
    const w=wordFor(q); if(w) grade(w,ok); });
  const p=Math.round(right/qs.length*100), [lv,msg]=level(p);
  const r=S.tests[n]||{best:0,tries:0}; const newBest=p>r.best; S.tests[n]={best:Math.max(r.best,p),tries:r.tries+1,last:p};
  save(); renderHeader();
  $("#submitT").parentElement.remove();
  $("#testArea").insertAdjacentHTML("afterbegin",'<div class="result"><div class="score mono">'+p+'%</div><div><div class="lvl">'+lv+'</div><div>'+right+' of '+qs.length+' correct. '+esc(msg)+(newBest?" New best score! 🏆":"")+'</div><div style="opacity:.8;font-size:14px;margin-top:6px">'+(missed.length?"Scroll down to review the "+missed.length+" red questions. Those words are back in your flashcards.":"Perfect score. You're a Section A expert!")+'</div><div class="row" style="margin-top:10px"><button class="btn small" type="button" id="retry">Try '+(n?"this test":"another")+' again</button><button class="btn small" type="button" id="toMenu">All tests</button></div></div></div>');
  $("#retry").onclick=()=>startTest(n); $("#toMenu").onclick=renderTestMenu;
  window.scrollTo({top:0,behavior:"smooth"});
  toast(p>=80?"Level 4! 🎉":"Score saved: "+p+"%");
}

const lineRange=(v,a,b)=>{const lo=Math.floor(v)-R(a,b);return [lo,lo+6]};

/* shared 3-decimal calculator working */
function calcSteps(n,neg){

function readPoint(l,p){
  const neg=p.neg!=null?p.neg:Math.random()<.4,n=p.n||nonSq(2,[60,150,300][l-1]),val=Math.sqrt(n)*(neg?-1:1),[lo,hi]=lineRange(val,1,3);
  const opts=[{n,neg}];if(neg&&Math.random()<.7)opts.push({n,neg:false});
  let tries=0;while(opts.length<4&&tries<800){tries++;const m=nonSq(2,400),sv=Math.sqrt(m)*(neg?-1:1);
    if(sv>lo+.15&&sv<hi-.15&&opts.every(o=>Math.abs(Math.sqrt(o.n)*(o.neg?-1:1)-sv)>0.35))opts.push({n:m,neg})}
  shuffle(opts);const ans=opts.findIndex(o=>o.n===n&&o.neg===neg),vv=o=>Math.sqrt(o.n)*(o.neg?-1:1);
  const a=isqrt(n);
  return {kind:'mc',v:'read',prompt:`Which number is at point <b>P</b>?${nl(lo,hi,[{v:val,label:'P',c:'ptP'}])}`,choices:opts.map(o=>rad(o.n,o.neg)),ans,answerText:rad(n,neg),
    explain:()=>ol([`P is between ${F(neg?-(a+1):a)} and ${F(neg?-a:a+1)}, at about ${F(val,1)}.`,
      `Estimate each choice: ${opts.map(o=>`${rad(o.n,o.neg)} ≈ ${F(vv(o),1)}`).join(', ')}.`,
      `Only ${rad(n,neg)} ≈ ${F(val,1)} matches P.`]),
    hint:'Estimate each choice by finding the perfect squares on either side. Watch the signs.'};
}
G.line=(l,p={})=>((p.v||(Math.random()<.65?'place':'read'))==='place'?place(l,p):readPoint(l,p));

G.compare=(l,p={})=>{
  const v=p.v||pick(l===1?['int','int','dec','roots','equal']:['int','dec','roots','negInt','negRoots','dec','equal']);
  const hiR=[80,150,300][l-1];let n=p.n||nonSq(5,hiR),Y,Ysq,Ytxt;
  const base=v.replace('neg','').toLowerCase();
  if(base==='int'){const m=Math.max(2,Math.round(Math.sqrt(n))+pick([0,0,1,-1]));Y=String(m);Ysq=m*m;Ytxt=`${m}² = ${m*m}`}
  else if(base==='dec'){const t=p.t!=null?p.t:rnd(Math.sqrt(n)+pick([0,0,.1,-.1]),1);Y=F(t,1);Ysq=rnd(t*t,4);Ytxt=`${F(t,1)}² = ${F(Ysq)}`}
  else if(base==='roots'){let b;do{b=R(5,hiR)}while(b===n);Y=rad(b);Ysq=b;Ytxt=`(${rad(b)})² = ${b}`}
  else{const k=R(3,15);n=k*k;Y=String(k);Ysq=k*k;Ytxt=`${k}² = ${k*k}`}
  const pos=near(n,Ysq)?'=':n<Ysq?'<':'>',neg=v.startsWith('neg'),flip={'<':'>','>':'<','=':'='},ans=neg?flip[pos]:pos;
  const A=rad(n,neg),B=neg?`−${Y}`:Y,sy=['<','>','='];
  const steps=[neg?`Ignore the minus signs for a moment and compare ${rad(n)} with ${Y}.`:'',
    'Square both. For positive numbers, squaring keeps the order the same.',
    `(${rad(n)})² = ${n} and ${Ytxt}.`,`${n} ${pos} ${F(Ysq)}, so ${rad(n)} ${pos} ${Y}.`,
    neg?`Now bring the minus signs back. On the negative side, the number further from zero is smaller, so the symbol flips: ${A} <b>${ans}</b> ${B}.`:''];
  return {kind:'mc',v,sym:true,fixed:p.n!=null,prompt:`Choose the symbol that makes this true.<div class="cmp"><span>${A}</span><span class="cbox">?</span><span>${B}</span></div>`,
    choices:sy,ans:sy.indexOf(ans),answerText:`${A} ${ans} ${B}`,explain:()=>ol(steps),
    hint:'Square both numbers and compare. If both are negative, compare the positive versions first, then flip the symbol.',
    diag:i=>neg&&sy[i]===pos&&pos!==ans?'You compared the positive versions correctly, but for negatives the symbol flips.':''};
};

G.word=(l,p={})=>{
  const v=p.v||pick(['side3','irr','fence','areaOfRoot','pi2','side3','fence']);
  if(v==='side3'){const A=p.n||nonSq(20,[150,400,900][l-1]),ex=Math.sqrt(A),ans=rnd(ex,3);
    return {kind:'num',v,unit:'cm',prompt:`<div class="sqfig">${sqFig(`A = ${A} cm²`)}<span>A square has an area of <b>${A} cm²</b>. Find the length of one side, rounded to 3 decimal places.</span></div>`,ans,answerText:`${F(ans,3)} cm`,
      check:x=>near(x,ans),explain:()=>ol([`Area = side × side, so side = ${rad(A)}.`,...calcSteps(A,false)]),diag:(x,raw)=>near(x,A/4)?'Dividing the area by 4 does not give the side. Side = √area.':calcDiag(x,raw,ex,ans,3),
      hint:'Area = side × side, so the side is the square root of the area.'}}
  if(v==='irr'){const A=nonSq(20,300),c=shuffle([rad(A),`${A} ÷ 2`,`${A} ÷ 4`,`${A}²`]);
    return {kind:'mc',v,prompt:`A square has an area of <b>${A} cm²</b>. Which is the <b>exact</b> length of one side, written as an irrational number?`,choices:c,ans:c.indexOf(rad(A)),answerText:rad(A)+' cm',
      explain:()=>ol(['Area = side × side.',`So side = ${rad(A)}. ${A} is not a perfect square, so ${rad(A)} is irrational, and that symbol is the exact value.`,`${A} ÷ 2 and ${A} ÷ 4 come from halving or quartering. That is not how area and side are linked.`]),
      hint:'Which number, multiplied by itself, gives the area?'}}
  if(v==='fence'){const k=R(5,[15,25,40][l-1]),A=k*k;
    return {kind:'num',v,unit:'m',prompt:`A square garden has an area of <b>${A} m²</b>. How many metres of fence go all the way around it?`,ans:4*k,answerText:`${4*k} m`,
      check:x=>near(x,4*k),explain:()=>ol([`Side = ${rad(A)} = ${k} m, because ${k} × ${k} = ${A}.`,'The fence goes around all 4 sides, so perimeter = 4 × side.',`4 × ${k} = ${4*k} m.`]),
      diag:x=>near(x,k)?'That is one side. The fence goes around all 4 sides.':near(x,A/4)?'Dividing the area by 4 does not give the side. Find the side first with a square root.':'',
      hint:'Find one side with a square root, then add up all four sides.'}}
  if(v==='areaOfRoot'){const m=nonSq(2,99);
    return {kind:'num',v,unit:'cm²',prompt:`A square has sides of length ${rad(m)} cm. What is its area?`,ans:m,answerText:`${m} cm²`,check:x=>near(x,m),
      explain:()=>ol([`Area = side × side = ${rad(m)} × ${rad(m)}.`,`A square root times itself gives back the number inside: ${m}.`,`So the area is ${m} cm².`]),
      diag:x=>near(x,4*Math.sqrt(m))||near(x,rnd(4*Math.sqrt(m),3))?'That is the perimeter. Area = side × side.':'',hint:'Area = side × side. What happens when you multiply a square root by itself?'}}
  return {kind:'num',v:'pi2',fixed:true,prompt:'To place π² on a number line, you need its value. What is π² rounded to <b>2 decimal places</b>?',ans:9.87,answerText:'9.87',check:x=>near(x,9.87),
    explain:()=>ol(['Use the π key: π = 3.14159265…','π² = π × π = <span class="n">9.86<mark>9</mark>60…</span>','For 2 decimal places look at the 3rd decimal digit. It is 9, so round up: <b class="n">9.87</b>.','Using 3.14 gives 3.14 × 3.14 = 9.8596, which rounds to 9.86. That is slightly low because 3.14 is a bit smaller than π.','On a number line, π² sits just left of 10.']),
    diag:x=>near(x,9.86)?'3.14 is already rounded, so 3.14 × 3.14 comes out slightly low. Use the π key.':near(x,9.8596)?'Round to 2 decimal places. Also 3.14 is slightly smaller than π, so use the π key.':near(x,6.28)?'6.28 is 2 × π. π² means π × π.':'',
    hint:'π² means π × π. Use the π key, not 3.14.'};
};

function level(id){const r=(RS.m[id]||[]).slice(-6);if(r.length<3)return 1;const a=r.reduce((x,y)=>x+y,0)/r.length;return a>=.84?3:a>=.6?2:1}

/* ---------- rounds ---------- */
function start(mode,skill){
  let plan=[];
  if(mode==='skill')for(let i=0;i<10;i++)plan.push({skill});
  else if(mode==='mixed'){SKILLS.forEach(s=>{plan.push({skill:s.id},{skill:s.id})});shuffle(plan)}
  else plan=FIX.map(([skill,make])=>({skill,make}));
  S={view:'quiz',mode,skill,plan,i:0,score:0,streak:0,extra:0,log:[]};
  showQ();
}
function materialize(e){const lvl=level(e.skill),q=e.make?e.make():G[e.skill](lvl);q.skill=e.skill;q.lvl=lvl;q.retry=!!e.retry;return q}
function numBox(id){return `<span class="nb"><button type="button" class="pm" data-for="${id}" aria-label="Switch between positive and negative">±</button><input id="${id}" class="num" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Your answer"></span>`}

function showQ(){
  const e=S.plan[S.i];if(!e.q)e.q=materialize(e);const q=e.q;
  S.answered=false;S.lineV=null;
  let area='';
  if(q.kind==='mc')area=`<div class="choices">${q.choices.map((c,i)=>`<button type="button" class="choice${q.sym?' sym':''}" data-i="${i}">${c}</button>`).join('')}</div>`;
  if(q.kind==='num')area=`<div class="ansrow">${numBox('rt-a1')}${q.unit?`<span class="unit">${q.unit}</span>`:''}</div>`;
  if(q.kind==='pair')area=`<div class="ansrow"><span>Between</span>${numBox('rt-a1')}<span>and</span>${numBox('rt-a2')}</div>`;
  if(q.kind==='line')area=`${nl(q.lo,q.hi,[],q.lbl)}<p class="linestat" id="rt-lineStat">Tap the line to place your point. Drag or use the arrow keys to adjust.</p>`;
  app.innerHTML=`
  <div class="qbar">
    <button class="rt-link" type="button" data-act="home">← All skills</button>
    <div class="prog"><span>Question ${S.i+1} of ${S.plan.length}</span><div class="pbar"><i style="width:${S.i/S.plan.length*100}%"></i></div></div>
    <div class="score"><b>${S.score}</b>/${S.log.length} right${S.streak>=3?` <span class="rt-streak">${S.streak} in a row</span>`:''}</div>
  </div>
  <article class="qcard">
    <p class="eyebrow">${skillName(q.skill)}${q.retry?' · <span class="retry">Second chance</span>':''}</p>
    <div class="prompt">${q.prompt}</div>
    <div>${area}</div>
    <p class="msg" id="rt-msg"></p>
    <div class="row" id="rt-actions">
      ${q.kind!=='mc'?'<button class="btn primary" type="button" id="rt-check">Check</button>':''}
      <button class="btn ghost" type="button" id="rt-hintBtn">Hint</button>
      <button class="btn ghost" type="button" data-act="sq">Squares 1–30</button>
    </div>
    <div class="hint" id="rt-hint" hidden>${q.hint}</div>
    <div id="rt-fb"></div>
  </article>`;
  if(q.kind==='line')bindLine(q);
  const first=$('#rt-a1');if(first&&matchMedia('(pointer:fine)').matches)first.focus();
}

function bindLine(q){
  const svg=$('#rt-nlq');let down=false;
  const X=v=>NLP+(v-q.lo)/(q.hi-q.lo)*(NLW-2*NLP);
  const clamp=v=>Math.round(Math.max(q.lo,Math.min(q.hi,v))*20)/20;
  const toV=cx=>{const r=svg.getBoundingClientRect();return clamp(q.lo+(((cx-r.left)/r.width*NLW)-NLP)/(NLW-2*NLP)*(q.hi-q.lo))};
  const set=v=>{S.lineV=v;const g=$('#rt-pmk');g.setAttribute('transform',`translate(${X(v).toFixed(1)},0)`);g.style.display='';
    const t=$('#rt-pmt'),x=X(v);t.setAttribute('x',x<40?(40-x).toFixed(1):x>NLW-40?(NLW-40-x).toFixed(1):'0');
    $('#rt-lineStat').textContent='Point placed. Drag or use the arrow keys to adjust, then press Check.';$('#rt-msg').textContent=''};
  svg.addEventListener('pointerdown',e=>{if(S.answered)return;down=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}set(toV(e.clientX));e.preventDefault()});
  svg.addEventListener('pointermove',e=>{if(down&&!S.answered)set(toV(e.clientX))});
  ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>down=false));
  svg.addEventListener('keydown',e=>{if(S.answered)return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const v=S.lineV==null?(q.lo+q.hi)/2:S.lineV;set(clamp(v+(e.key==='ArrowRight'?.1:-.1)))}
    if(e.key==='Enter'){e.preventDefault();e.stopPropagation();check()}});
}

function parseNum(s){s=(s||'').replace(/[−–]/g,'-').replace(/[\s,]/g,'');if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;return parseFloat(s)}

function check(choice){
  if(S.answered)return;const q=S.plan[S.i].q,msg=$('#rt-msg');let ok,shown,note='',ua;
  if(q.kind==='mc'){ua=choice;ok=ua===q.ans;shown=q.choices[ua];note=!ok&&q.diag?q.diag(ua):''}
  if(q.kind==='num'){const raw=$('#rt-a1').value.trim();ua=parseNum(raw);if(isNaN(ua)){msg.textContent='Type a number first, for example 6.9 or −7.';return}
    ok=q.check(ua);shown=raw.replace('-','−')+(q.unit?' '+q.unit:'');note=!ok&&q.diag?q.diag(ua,raw.replace(/[−–]/g,'-')):''}
  if(q.kind==='pair'){const r1=$('#rt-a1').value.trim(),r2=$('#rt-a2').value.trim(),x=parseNum(r1),y=parseNum(r2);
    if(isNaN(x)||isNaN(y)){msg.textContent='Fill in both boxes with whole numbers.';return}
    ua=[x,y];ok=q.check(x,y);shown=`${F(x)} and ${F(y)}`;note=!ok?q.diag(x,y):''}
  if(q.kind==='line'){if(S.lineV==null){msg.textContent='Tap the number line to place your point first.';return}
    ua=S.lineV;ok=q.check(ua);shown=`a point at about ${F(ua,2)}`;note=!ok?q.diag(ua):''}
  msg.textContent='';S.answered=true;S.log.push({skill:q.skill,ok,q});record(q.skill,ok);
  let added=false;
  if(ok){S.score++;S.streak++}
  else{S.streak=0;if(S.extra<6){S.plan.push({skill:q.skill,retry:true,make:()=>G[q.skill](q.lvl,q.fixed?{}:{v:q.v})});S.extra++;added=true}}
  root.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===ua)b.classList.add(ok?'picked-ok':'picked-no');else if(i===q.ans)b.classList.add('right')});
  root.querySelectorAll('.num,.pm').forEach(el=>el.disabled=true);
  $('#rt-hintBtn').disabled=true;
  const work=q.explain(ua);
  $('#rt-fb').innerHTML=ok
    ?`<div class="fb ok"><p class="fbh">Correct${S.streak>=3?` · ${S.streak} in a row`:''}</p><details><summary>See the working</summary>${work}</details></div>`
    :`<div class="fb no"><p class="fbh">Not quite</p><p>You answered <b>${shown}</b>. The answer is <b>${q.answerText}</b>.</p>
      ${note?`<p class="watch"><b>Watch out:</b> ${note}</p>`:''}<p class="sh">How to get there</p>${work}
      ${added?'<p class="added">A similar question has been added to the end of this round.</p>':''}</div>`;
  const last=S.i===S.plan.length-1;
  $('#rt-actions').innerHTML=`<button class="btn primary" type="button" id="rt-next">${last?'See results':'Next question'}</button><button class="btn ghost" type="button" data-act="sq">Squares 1–30</button>`;
  $('#rt-next').focus({preventScroll:true});
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  $('#rt-fb').scrollIntoView({behavior:rm?'auto':'smooth',block:'nearest'});
}
function next(){if(S.i<S.plan.length-1){S.i++;showQ();window.scrollTo(0,0)}else end()}

function apQ(it,lvl){
  const [s,v,a,note,doerX,link]=it, P=a==='P';

  const m=s.match(/\bby ([^.,!?]+)[.!?]?$/), doer=P?(doerX||(m?m[1]:'')):'';
  const vw=v.split(' '), part=vw[vw.length-1], helpers=vw.slice(0,-1).join(' ');
  let steps;
  if(link) steps=[`The verb is <mark>${esc(v)}</mark> on its own. Here it is a <b>linking verb</b>: it connects <b>${esc(subj)}</b> to a description.`,'It is not a helping verb, and no past participle follows it, so the sentence is not passive.','Your workbook counts sentences like this as active.'];
  else if(P) steps=[`Find the whole verb: <mark>${esc(v)}</mark>.`,`It has a form of <i>be</i> (<b>${esc(helpers)}</b>) followed by the past participle <b>${esc(part)}</b>. That pattern is the passive voice.`,`The subject <b>${esc(subj)}</b> does not do the action. It receives it.`,doer?`The doer comes after "by": <b>${esc(doer)}</b>.`:'There is no "by" phrase, so we are not told who did it. It is still passive.'];
  else steps=[`Find the whole verb: <mark>${esc(v)}</mark>.`,`The subject <b>${esc(subj)}</b> does the action.`,'There is no "form of be + past participle" pattern, so it is active.'];

    explain:()=>`<p class="vt-sent sm">${hl(s,v)}</p>`+ol(steps),
    hint:'Find the whole verb first. Is there a form of "be" (is, are, was, were, been, being) followed by a past participle like "thrown" or "selected"? If yes, it is passive, with or without "by".',
    diag:i=>{
      if(P&&i===0&&!doer)return `A missing "by" phrase does not make a sentence active. "${esc(v)}" is be + past participle, so it is passive.`;
      if(P&&i===0)return `"${esc(v)}" is be + past participle, so the subject receives the action.`;
      if(link&&i===1)return `"${esc(v)}" is the only verb, and no past participle follows it. It links the subject to a description.`;

      if(!P&&i===1&&/\bby\b/.test(s))return `The word "by" alone does not make a sentence passive. Check the verb: "${esc(v)}" is not be + past participle.`;
      if(!P&&i===1)return `There is no be + past participle here. "${esc(v)}" is something the subject does.`;

function short(raw,model){return words(raw).length<words(model).length*0.6}

function rewQ(it,lvl,toActive){
  const model=it.acc[0];
  const steps=toActive
    ?[`Find the doer (after "by"): <b>${esc(it.doer)}</b>. It becomes the subject.`,`Find the passive verb: <b>${esc(it.pv)}</b> (${esc(it.tense)}). Use one active verb in the same tense: <b>${esc(it.verb)}</b>.`,`The old subject (<b>${esc(it.rec)}</b>) goes after the verb, and "by" disappears.`,`Answer: <b>${esc(model)}</b>`]
    :[`Find the receiver (the object): <b>${esc(it.rec)}</b>. It becomes the subject.`,`Find the active verb: <b>${esc(it.av)}</b> (${esc(it.tense)}). Passive in the same tense: <b>${esc(it.verb)}</b> (a form of be + past participle).`,`Move the doer to the end with "by": <b>by ${esc(it.by)}</b>.`,`Answer: <b>${esc(model)}</b>`];
  return {kind:'type',lvl,prompt:`<p class="vt-q">Rewrite this sentence in the <b>${toActive?'active':'passive'}</b> voice.</p><p class="vt-sent">${esc(it.q)}</p>`,answerText:esc(model),
    check:raw=>it.acc.some(a=>norm(a)===norm(raw)),
    explain:()=>ol(steps)+(it.tip?`<p class="watch"><b>Tip:</b> ${esc(it.tip)}</p>`:'')+(it.acc.length>1?'<p class="vt-also">Also correct: '+it.acc.slice(1).map(esc).join(' · ')+'</p>':''),
    hint:toActive?`Start with the doer: "${esc(it.doer)}". Then use ONE active verb in the same tense as "${esc(it.pv)}".`:`Start with "${esc(it.rec)}". Then use a form of be + past participle in the same tense, and end with "by ${esc(it.by)}".`,
    diag:raw=>{
      const n=norm(raw);
      if(short(raw,model))return 'Your sentence is unfinished. Include every part: who did what, to what.';
      if(toActive){
        const lb=leftoverBe(raw,model);
        if(n.includes('by '+norm(it.doer)))return `You kept the "by" phrase. In the active voice the doer (${esc(it.doer)}) moves to the front and "by" disappears.`;
        if(bePP(raw))return 'There is still a form of "be" + past participle, which is passive. Use one active verb instead.';
        if(lb)return `"${esc(lb)}" is left over from the passive sentence. The active sentence doesn't need it.`;
        if(!n.includes(norm(it.doer)))return `Who did the action? <b>${esc(it.doer)}</b>. Make the doer the subject.`;
        if(!hasWord(raw,it.verb))return `Check the verb. "${esc(it.pv)}" is ${esc(it.tense)}, so the active verb is "${esc(it.verb)}".`;
        if(n.indexOf(norm(it.doer))>n.search(verbRe(norm(it.verb))))return 'Put the doer before the verb.';

        if(!bePP(raw))return `Passive needs a form of "be" + past participle. Here that is "${esc(it.verb)}".`;
        if(!/\bby\b/.test(n))return `Keep the doer at the end with "by": "…by ${esc(it.by)}."`;
        if(!n.includes(norm(it.verb)))return `Check the verb. "${esc(it.av)}" is ${esc(it.tense)}${/s$/.test(norm(it.rec).split(' ').pop())?' and the new subject is plural':''}, so the passive is "${esc(it.verb)}".`;
        if(!n.includes(norm(it.rec)))return `The receiver, "${esc(it.rec)}", should become the new subject.`;
        if(n.indexOf(norm(it.rec))>n.indexOf(norm(it.verb)))return `Start with the receiver: "${esc(it.rec)}".`;
      }
      return 'Almost. Compare your sentence with the answer word by word: every word from the original sentence should still be there.'+(it.tip?' '+esc(it.tip):'');
    }};
}

function mcQ(it,lvl){

}

/* ---------- rounds ---------- */
function start(mode,lid){
  let plan=[];
  if(mode==='level'){const l=lvBy(lid);plan=shuffle(l.items).slice(0,10).map(item=>({lid,item}))}
  else if(mode==='fix')plan=FIX.map(([lid,item])=>({lid,item}));
  else{EXAM.forEach(([lid,n])=>shuffle(lvBy(lid).items).slice(0,n).forEach(item=>plan.push({lid,item})))}
  S={view:'quiz',mode,lid,plan,i:0,score:0,streak:0,extra:0,log:[],used:new Set(plan.map(p=>p.item))};
  showQ();
}
function altItem(lid){const pool=lvBy(lid).items.filter(x=>!S.used.has(x));const it=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;if(it)S.used.add(it);return it}
const title=()=>S.mode==='level'?`Level ${S.lid.slice(1)} · ${lvBy(S.lid).name}`:S.mode==='fix'?'Fix-it set':'Final exam';

function showQ(){
  const e=S.plan[S.i];if(!e.q){e.q=lvBy(e.lid).make(e.item);e.q.lid=e.lid}
  const q=e.q;S.answered=false;
  const area=q.kind==='mc'?`<div class="choices">${q.choices.map((c,i)=>`<button type="button" class="choice" data-i="${i}">${c}</button>`).join('')}</div>`
    :`<textarea id="vt-in" class="vt-in" rows="2" autocomplete="off" spellcheck="true" aria-label="Your sentence" placeholder="Type the whole sentence, then press Check"></textarea>`;
  app.innerHTML=`
  <div class="qbar">
    <button class="vt-link" type="button" data-act="home">← All levels</button>
    <div class="prog"><span>${esc(title())} · Question ${S.i+1} of ${S.plan.length}</span><div class="pbar"><i style="width:${S.i/S.plan.length*100}%"></i></div></div>
    <div class="score"><b>${S.score}</b>/${S.log.length} right${S.streak>=3?` <span class="vt-streak">${S.streak} in a row</span>`:''}</div>
  </div>
  <article class="qcard">
    <p class="eyebrow">Level ${q.lvl} · ${esc(lvBy(e.lid).name)}${e.retry?' · <span class="retry">Second chance</span>':''}</p>
    <div>${q.prompt}</div>
    <div>${area}</div>
    <p class="msg" id="vt-msg"></p>
    <div class="row" id="vt-actions">
      ${q.kind==='type'?'<button class="btn primary" type="button" id="vt-check">Check</button>':''}
      <button class="btn ghost" type="button" id="vt-hintBtn">Hint</button>
    </div>
    <div class="hint" id="vt-hint" hidden>${q.hint}</div>
    <div id="vt-fb"></div>
  </article>`;
  const inp=$('#vt-in');if(inp&&matchMedia('(pointer:fine)').matches)inp.focus();
}

function check(choice){
  if(S.answered)return;const e=S.plan[S.i],q=e.q,msg=$('#vt-msg');let ok,shown,note='',polish='';
  if(q.kind==='mc'){ok=choice===q.ans;shown=q.choices[choice];note=ok?'':q.diag(choice)}
  else{const raw=$('#vt-in').value.trim();if(!raw){msg.textContent='Type your sentence first.';return}
    ok=q.check(raw);shown=esc(raw);
    if(ok&&(!/^["“]?[A-Z]/.test(raw)||!/[.!?]["”]?$/.test(raw)))polish='Polish it: start with a capital letter and end with a period.';
    if(!ok)note=q.diag(raw)}
  msg.textContent='';S.answered=true;S.log.push({lid:e.lid,ok,q});record(e.lid,ok);
  let added=false;
  if(ok){S.score++;S.streak++}
  else{S.streak=0;if(S.mode!=='exam'&&S.extra<5){const it=altItem(e.lid);if(it){S.plan.push({lid:e.lid,item:it,retry:true});S.extra++;added=true}}}

/* =====================================================================

const F={};

    why:[`${p[0]} means × ${pow(p[1])}, so ${neat(c)} ${p[0]}${u[1]} = ${neat(c)} × ${pow(p[1])} ${u[2]}.`,(+c>=10||+c<1)?`Fix the coefficient so it is between 1 and 10.`:'',`<b>${sciC(v)} ${u[2]}</b>`],
    hint:'Swap the prefix for its power of 10, then make the coefficient between 1 and 10.'});};
F.convert=l=>{for(let tries=0;;tries++){const q=convert1(l);if(q||tries>50)return q||convert1(1)}};
function convert1(l){let u=pick(UNITS);let from,to;
  if(l===1){to=pick(MAIN);from=['',0]}else{const t=pick(['base','sci','pp']);if(t==='base'){to=pick(MAIN);from=['',0]}else if(t==='sci'){to=pick(MAIN);from=['sci',0]}else{do{from=pick(PFX.filter(x=>Math.abs(x[1])>=3));to=pick(PFX.filter(x=>Math.abs(x[1])>=3))}while(from===to||Math.abs(from[1]-to[1])>9)}}
  if(u[2]==='bytes'&&(to[1]<0||from[1]<0))u=UNITS[0];
  const ansC=C(pick([String(R(2,999)),(R(11,9999)/10).toFixed(1),(R(101,999)/100).toFixed(2).replace(/0$/,'')]),0);
  const baseV=shift(ansC,to[1]);
  let disp;if(from[0]==='sci')disp=`${sciC(baseV)} ${u[2]}`;else if(from[0]===''||from[1]===0)disp=`${S(baseV)} ${u[2]}`;else disp=`${S(shift(baseV,-from[1]))} ${from[0]}${u[1]}`;

    why:[from[0]&&from[0]!=='sci'?`First to the base unit: ${disp} = ${S(baseV)} ${u[2]} (× ${pow(from[1])}).`:`In ${u[2]}: ${S(baseV)} ${u[2]}.`,`1 ${to[0]}${u[0]} = ${pow(to[1])} ${u[2]}, so divide by ${pow(to[1])}: move the decimal point ${Math.abs(to[1])} places ${to[1]>0?'left':'right'}.`,`<b>${S(ansC)} ${to[0]}${u[1]}</b>`],

  while(items.length<n&&tries<300){tries++;const p=pick(PFX.filter(x=>Math.abs(x[1])>=3||x[0]==='centi'));const form=pick(l===1?['plain']:['plain','sci','base']);

function planFor(mode,arg){
  if(mode==='practice'){const keys=keysOf(arg),lv=level(arg),p=[];const ks=shuffle(keys.concat(keys)).slice(0,10);ks.forEach(k=>p.push({k,l:lv}));return p}
  if(mode==='test'){const keys=keysOf(arg);const ks=shuffle(keys.concat(keys)).slice(0,12);return ks.map((k,i)=>({k,l:i<4?2:3}))}
  if(mode==='warm'){const p=dueReviews().slice(0,3).map(r=>({k:r.k,l:level(r.k[0]),rev:true}));
    const started=SECTIONS.filter(s=>ss(s.id).m.length||ss(s.id).read).map(s=>s.id);const pool=(started.length?started:SECTIONS.map(s=>s.id));
    while(p.length<5){const s=pick(pool);p.push({k:pick(keysOf(s)),l:level(s)})}return shuffle(p)}
  const e=EXAMS.find(x=>x.id===arg);const per=e.id==='final'?{A:5,B:5,C:5,D:5,E:5,F:5}:{A:4,B:3,C:3,D:3,E:4,F:3};
  let ks=[];Object.entries(per).forEach(([s,n])=>{const keys=shuffle(keysOf(s).concat(keysOf(s)));ks=ks.concat(keys.slice(0,n))});
  if(e.id==='final'){['F.extreme','B.order','F.word','E.cmp','C.times'].forEach((k,i)=>{ks[ks.length-1-i]=k})}
  ks=shuffle(ks);return ks.map((k,i)=>({k,l:e.lv[Math.min(2,Math.floor(i/(ks.length/3)))]}));
}

}

function readAnswer(q,choice){

/* ================= FRACTIONS TRAINER · question engine =================
   Chapter 3 Recall (equivalent fractions, simplest form, mixed numbers, adding and subtracting,
   whole numbers × ÷ fractions, fractions × ÷ fractions, the unit method) and Lesson 3.1
   (multiplying improper fractions and mixed numbers). Arithmetic is exact: a fraction is [n,d].
   Every wrong answer is checked against common mistakes so the feedback says what went wrong. */
const FG=(function(){
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const coin=p=>Math.random()<(p==null?.5:p);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ol=a=>'<ol class="steps">'+a.filter(Boolean).map(x=>'<li>'+x+'</li>').join('')+'</ol>';

/* ---------- exact fractions ---------- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const red=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);return [n/g,d/g]};
const add=(a,b)=>red(a[0]*b[1]+b[0]*a[1],a[1]*b[1]);
const sub=(a,b)=>red(a[0]*b[1]-b[0]*a[1],a[1]*b[1]);
const mul=(a,b)=>red(a[0]*b[0],a[1]*b[1]);
const div=(a,b)=>red(a[0]*b[1],a[1]*b[0]);
const eq=(a,b)=>a[0]*b[1]===b[0]*a[1];
const W=w=>[w,1];
const M=(w,n,d)=>red(w*d+n,d);                       // mixed number → fraction
const parts=f=>{const [n,d]=red(f[0],f[1]);return {w:Math.floor(n/d),n:n%d,d}};
/* display */
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mxn">${w?w:''}${n?fr(n,d):''}</span>`;
const imp=f=>f[1]===1?String(f[0]):fr(f[0],f[1]);    // as a (possibly improper) fraction
function simp(f){const p=parts(f);if(!p.n)return String(p.w);return mx(p.w,p.n,p.d)}  // simplest form
const both=f=>{const p=parts(f);return f[1]!==1&&p.w?`${imp(f)} = ${simp(f)}`:simp(f)};
const X=' × ',D=' ÷ ';
/* an operand written the way the question shows it: {f:[n,d], w:whole part or 0, h:html} */
const opF=(n,d)=>({f:red(n,d),raw:[n,d],w:0,h:fr(n,d),imp:[n,d]});
const opM=(w,n,d)=>({f:M(w,n,d),raw:[n,d],w,h:mx(w,n,d),imp:[w*d+n,d]});
const opW=w=>({f:W(w),raw:[w,1],w,h:String(w),imp:[w,1],whole:true});

/* ---------- reading an answer: whole, numerator, denominator boxes ---------- */
function parse(u){
  const t=s=>String(s??'').trim().replace(/\s/g,'');
  const w=t(u.w),n=t(u.n),d=t(u.d);
  if(!w&&!n&&!d)return {err:'Type your answer first.'};
  if([w,n,d].some(x=>x&&!/^\d+$/.test(x)))return {err:'Use whole numbers only in the boxes.'};
  if((n&&!d)||(d&&!n))return {err:'Fill in both the top (numerator) and the bottom (denominator), or leave both empty for a whole number.'};
  if(d&&+d===0)return {err:'The denominator cannot be 0.'};
  const W_=w?+w:0,N=n?+n:0,Dn=d?+d:1;
  return {w:W_,n:N,d:Dn,hasW:!!w,hasF:!!n,val:red(W_*Dn+N,Dn)};
}
const userHtml=p=>p.hasF?(p.hasW?mx(p.w,p.n,p.d):fr(p.n,p.d)):String(p.w);
/* form problems for an answer whose value is right */
function formIssue(p,form,ans){
  if(form==='any')return '';
  if(form==='improper'){if(ans[1]===1)return p.hasF&&p.n%p.d===0&&p.d>1?'Simplify: it is a whole number.':'';if(p.hasW&&p.w)return 'The question asks for an improper fraction: put everything over the denominator (no whole-number part).';
    if(gcd(p.n,p.d)!==1)return `Right value, but simplify it: divide the top and bottom by ${gcd(p.n,p.d)}.`;return ''}
  if(p.hasF&&p.n>=p.d)return `Right value, but ${p.hasW?'the fraction part must be less than 1':'it is still an improper fraction'}. Write it as ${ans[1]===1?'a whole number':'a mixed number'}: ${simp(ans)}.`;
  if(p.hasF&&p.n&&gcd(p.n,p.d)!==1)return `Right value, but not in simplest form. Divide the top and bottom by their greatest common factor, ${gcd(p.n,p.d)}.`;
  if(p.hasF&&p.n===0)return 'Leave the fraction boxes empty when the answer is a whole number.';
  return '';
}

/* ---------- question builders ---------- */
/* fraction answer. traps: [[value, message]] for common wrong answers */
function FRAC(o){
  const traps=(o.traps||[]).filter(t=>t&&t[0]&&t[0][1]>0&&!eq(t[0],o.ans));
  const form=o.form||'simplest';
  const answerText=form==='improper'?imp(o.ans):form==='any'?(o.anyText||both(o.ans)):simp(o.ans);
  return Object.assign({kind:'frac',answerText,
    check:u=>{const p=parse(u);if(p.err)return false;if(o.okIf)return o.okIf(p);return eq(p.val,o.ans)&&!formIssue(p,form,o.ans)},
    diag:u=>{const p=parse(u);if(p.err)return '';if(eq(p.val,o.ans))return formIssue(p,form,o.ans);
      const t=traps.find(t=>eq(t[0],p.val));return t?t[1]:(o.fallback||'')},
    explain:()=>ol(o.why)},o,{traps,form});
}
function INT(o){
  return Object.assign({kind:'int',answerText:(o.pre||'')+o.ans+(o.post||''),
    check:v=>+v===o.ans,diag:v=>{const t=(o.traps||[]).find(t=>t[0]===+v&&t[0]!==o.ans);return t?t[1]:''},explain:()=>ol(o.why)},o);
}
/* multiple choice: opts = [[html, message-if-picked]], first one is right */
function MC(o){
  const seen=new Set(),opts=o.opts.filter(x=>!seen.has(x[0])&&seen.add(x[0]));
  const order=shuffle(opts.map((_,i)=>i)),choices=order.map(i=>opts[i][0]),ans=order.indexOf(0);
  return Object.assign({kind:'mc',choices,ans,answerText:opts[0][0],diag:i=>opts[order[i]][1]||'',explain:()=>ol(o.why)},o);
}

/* ---------- shared mistake messages ---------- */
const MSG={
  addAll:'You added the numerators and added the denominators. Fractions need a common denominator first; only the numerators are added.',
  subAll:'You subtracted the numerators and the denominators. Rename both fractions with a common denominator first, then subtract only the numerators.',
  noRename:'You changed the denominators but kept the old numerators. Whatever you multiply the denominator by, multiply the numerator by the same number.',
  noFlip:'You multiplied without flipping. To divide, multiply by the reciprocal of the second fraction (the one after ÷).',
  flipFirst:'You flipped the first fraction. Keep the first one, change ÷ to ×, and flip the second one (keep · change · flip).',
  flipBoth:'You flipped both fractions. Only the second fraction (the divisor) is flipped.',
  crossMul:'You cross-multiplied, which is what dividing does. For ×, multiply top × top and bottom × bottom.',
  wholeBoth:'You multiplied the top and the bottom by the whole number, which just makes an equivalent fraction. A whole number is n/1: multiply only the numerator.',
  caution:'Careful: you multiplied only the fraction parts and kept the whole number. A mixed number is a whole plus a fraction, so change every mixed number to an improper fraction first (the textbook’s “Caution”).',
  wholeTimesWhole:'You multiplied the whole numbers and the fractions separately. That misses the cross pieces: change each mixed number to an improper fraction first.',
  wholeAsDen:'Do not rewrite the whole number with the fraction’s denominator. A whole number n is n/1, so 3 ÷ ½ = 3/1 × 2/1 = 6, not 6/1 × 2/1 = 12.',
  toImp:'For the numerator, multiply the whole number by the denominator, then add the numerator: w × d + n.'
};

/* ---------- A · Equivalent fractions and simplest form (Recall) ---------- */
function properF(l){const d=pick(l===1?[2,3,4,5,6,8,10]:l===2?[3,4,5,6,7,8,9,10,12]:[6,7,8,9,11,12,14,15,16]);let n;do n=R(1,d-1);while(gcd(n,d)!==1);return [n,d]}
const A={
  missing(l){const [n,d]=properF(l),k=R(2,l===1?5:l===2?8:12);const up=l<3||coin(.5);
    if(up){const tb=coin();const pr=tb?`${fr(n,d)} = ${fr('?',d*k)}`:`${fr(n,d)} = ${fr(n*k,'?')}`;
      return INT({sec:'A',prompt:`Fill in the missing number.<span class="big">${pr}</span>`,ans:tb?n*k:d*k,
        traps:[[tb?n+(d*k-d):d+(n*k-n),'You added the same number to the top and bottom. Equivalent fractions come from <b>multiplying</b> (or dividing) the top and bottom by the same number.']],
        hint:`What was ${tb?d:n} multiplied by to get ${tb?d*k:n*k}?`,
        why:[tb?`${d} × ${k} = ${d*k}, so the denominator was multiplied by ${k}.`:`${n} × ${k} = ${n*k}, so the numerator was multiplied by ${k}.`,`Do the same to the ${tb?'numerator':'denominator'}: ${tb?n:d} × ${k} = ${tb?n*k:d*k}.`,`${fr(n,d)} = ${fr(n*k,d*k)}`]})}
    const tb=coin();const pr=tb?`${fr(n*k,d*k)} = ${fr('?',d)}`:`${fr(n*k,d*k)} = ${fr(n,'?')}`;
    return INT({sec:'A',prompt:`Fill in the missing number.<span class="big">${pr}</span>`,ans:tb?n:d,
      traps:[[tb?n*k-(d*k-d):d*k-(n*k-n),'You subtracted the same number from the top and bottom. Divide both by the same number instead.']],
      hint:`What was ${tb?d*k:n*k} divided by to get ${tb?d:n}?`,
      why:[`${tb?d*k:n*k} ÷ ${k} = ${tb?d:n}.`,`Divide the ${tb?'numerator':'denominator'} by ${k} too: ${tb?n*k:d*k} ÷ ${k} = ${tb?n:d}.`]})},
  equiv(l,fixed){const [n,d]=fixed||(l===1?pick([[2,3],[3,4],[5,6],[1,2],[2,5]]):properF(l));
    return FRAC({sec:'A',prompt:`Write an equivalent fraction for ${fr(n,d)}. Use a different denominator.`,ans:[n,d],form:'any',anyText:`${fr(n*2,d*2)}, ${fr(n*3,d*3)}, ${fr(n*4,d*4)}, …`,
      okIf:p=>!p.hasW&&p.hasF&&eq(p.val,[n,d])&&p.d!==d,
      diag:u=>{const p=parse(u);if(p.err)return '';if(eq(p.val,[n,d]))return p.d===d?'That is the same fraction. Multiply the top and bottom by 2, 3, 4… to get a new denominator.':'';
        if(p.hasF&&p.n-n===p.d-d)return 'You added the same number to the top and bottom. Multiply them by the same number instead.';return 'That fraction has a different value. Multiply the top and the bottom by the <b>same</b> number.'},
      hint:'Multiply the numerator and the denominator by the same number, like 2 or 3.',
      why:[`Multiply the top and bottom by the same number: ${fr(n,d)} = ${fr(n+' × 2',d+' × 2')} = ${fr(n*2,d*2)}.`,`Any of ${fr(n*2,d*2)}, ${fr(n*3,d*3)}, ${fr(n*4,d*4)} is correct.`]})},
  simplify(l){let n,d,k;do{[n,d]=properF(l);k=pick(l===1?[2,3,5]:l===2?[2,3,4,5,6]:[4,6,8,9,12])}while(n*k>150||d*k>200);
    const big=l===3&&coin(.4);if(big){n=n+d*R(1,2)}
    const N=n*k,Dd=d*k,half=gcd(N,Dd)>2&&k%2===0?[N/2,Dd/2]:null;
    return FRAC({sec:'A',prompt:`Simplify.${big?' Write the answer as a mixed number.':''}<span class="big">${fr(N,Dd)}</span>`,ans:[n,d],
      hint:`Find the greatest common factor of ${N} and ${Dd}.`,
      why:[`The greatest common factor of ${N} and ${Dd} is ${gcd(N,Dd)}.`,`${fr(N+' ÷ '+gcd(N,Dd),Dd+' ÷ '+gcd(N,Dd))} = ${fr(...red(N,Dd))}`,big?`As a mixed number: ${simp([n,d])}`:'',half?`Dividing by 2 only gives ${fr(...half)}, which can still be simplified.`:'']})},
  notEquiv(l){const [n,d]=properF(Math.min(l,2)),a=R(2,4),b=a+R(1,3),c=R(2,5);
    return MC({sec:'A',prompt:`Which fraction is <b>not</b> equivalent to ${fr(n,d)}?`,
      opts:[[fr(n+c,d+c),''],[fr(n*a,d*a),`${fr(n*a,d*a)} is ${fr(n,d)} with the top and bottom × ${a}, so it is equivalent.`],[fr(n*b,d*b),`${fr(n*b,d*b)} is ${fr(n,d)} with the top and bottom × ${b}, so it is equivalent.`],[fr(n*(b+1),d*(b+1)),`That one is ${fr(n,d)} with the top and bottom × ${b+1}, so it is equivalent.`]],
      hint:'Equivalent fractions come from multiplying the top and bottom by the same number. Which one did not?',
      why:[`${fr(n*a,d*a)}, ${fr(n*b,d*b)} and ${fr(n*(b+1),d*(b+1))} all simplify to ${fr(n,d)}.`,`${fr(n+c,d+c)} adds ${c} to the top and bottom. Adding does not make an equivalent fraction.`]})}
};

/* ---------- B · Mixed numbers and improper fractions ---------- */
function mixedOp(l){const d=pick(l===1?[2,3,4,5]:l===2?[3,4,5,6,8]:[6,7,8,9,12,15,16]);let n;do n=R(1,d-1);while(gcd(n,d)!==1);return [R(1,l===1?3:l===2?6:12),n,d]}
const B={
  toImp(l){const [w,n,d]=mixedOp(l);
    return FRAC({sec:'B',prompt:`Write as an improper fraction.<span class="big">${mx(w,n,d)}</span>`,ans:M(w,n,d),form:'improper',
      traps:[[[w*n+d,d],MSG.toImp+` You did ${w} × ${n} + ${d}.`],[[w+n,d],MSG.toImp+` You only added ${w} + ${n}.`],[[w*d,d],`You turned ${w} into ${fr(w*d,d)} but forgot to add the ${n}.`],[[w*d*n,d],MSG.toImp]],
      hint:`How many ${d===2?'halves':'pieces of size '+fr(1,d)} are in ${w} wholes? Then add ${n} more.`,
      why:[`${w} whole${w>1?'s':''} = ${w} × ${d} = ${w*d} pieces of size ${fr(1,d)}.`,`Add the ${n}: ${w*d} + ${n} = ${w*d+n}.`,`${mx(w,n,d)} = ${fr(w*d+n,d)}`]})},
  toMixed(l){const [w,n,d]=mixedOp(l),N=w*d+n;
    return FRAC({sec:'B',prompt:`Write as a mixed number.<span class="big">${fr(N,d)}</span>`,ans:[N,d],
      traps:[[[w*d+(d-n),d],`Check the remainder: ${N} ÷ ${d} = ${w} remainder ${n}, so the fraction part is ${fr(n,d)}.`],[[w,1],`The remainder is the numerator of the fraction part: ${fr(n,d)}. Don’t drop it.`],[[n*d+w,d],'The quotient is the whole number and the remainder goes on top: swap them.']],
      hint:`How many times does ${d} go into ${N}? What is left over?`,
      why:[`${N} ÷ ${d} = ${w} remainder ${n}.`,`The quotient ${w} is the whole number; the remainder ${n} is the new numerator over ${d}.`,`${fr(N,d)} = ${mx(w,n,d)}`]})},
  pieces(l){const w=R(2,l===1?4:9),d=pick([2,3,4,5,6,8,10,12]);const nm={2:'halves',3:'thirds',4:'quarters',5:'fifths',6:'sixths',8:'eighths',10:'tenths',12:'twelfths'}[d];
    return INT({sec:'B',prompt:`How many ${nm} are in ${w}?`,ans:w*d,traps:[[w+d,`Each whole has ${d} ${nm}, so multiply: ${w} × ${d}.`]],hint:`One whole = ${fr(d,d)}.`,
      why:[`1 whole = ${d} ${nm}.`,`${w} wholes = ${w} × ${d} = ${w*d} ${nm}, so ${w} = ${fr(w*d,d)}.`]})},
  bigger(l){let a,b;do{a=mixedOp(l);b=[0,a[0]*a[2]+a[1]+pick([-1,1]),a[2]]}while(b[1]<=0||b[1]%b[2]===0);
    const A_=M(...a),B_=[b[1],b[2]],big=A_[0]*B_[1]>B_[0]*A_[1];
    return MC({sec:'B',prompt:`Which is greater?`,sym:false,
      opts:big?[[mx(...a),''],[fr(b[1],b[2]),`${fr(b[1],b[2])} = ${simp(B_)}, which is less than ${mx(...a)}.`]]:[[fr(b[1],b[2]),''],[mx(...a),`${mx(...a)} = ${fr(...A_.map(x=>x))}, which is less than ${fr(b[1],b[2])}.`]],
      hint:'Write both as improper fractions with the same denominator.',
      why:[`${mx(...a)} = ${fr(A_[0],A_[1])}.`,`Compare ${fr(A_[0],A_[1])} and ${fr(b[1],b[2])}: same denominator, so the bigger numerator wins.`]})}
};

/* ---------- C · Adding and subtracting with unlike denominators ---------- */
function unlike(l){let b,d;do{b=pick(l===1?[2,3,4,5,6]:l===2?[3,4,5,6,8,9,10]:[4,6,8,9,10,12,15]);d=pick(l===1?[2,3,4,6,8]:l===2?[3,4,6,8,12]:[5,6,8,9,12,15,20])}while(b===d);
  let a,c;do a=R(1,b-1);while(gcd(a,b)!==1);do c=R(1,d-1);while(gcd(c,d)!==1);return [[a,b],[c,d]]}
function renamed(x,y){const L=lcm(x[1],y[1]);return {L,x2:[x[0]*L/x[1],L],y2:[y[0]*L/y[1],L]}}
const C={
  add(l){const [x,y]=unlike(l),{L,x2,y2}=renamed(x,y),ans=add(x,y);
    return FRAC({sec:'C',prompt:`Add. Give your answer in simplest form.<span class="big">${fr(...x)} + ${fr(...y)}</span>`,ans,
      traps:[[[x[0]+y[0],x[1]+y[1]],MSG.addAll],[[x[0]+y[0],L],MSG.noRename],[[x[0]*y[1]+y[0]*x[1],x[1]+y[1]],MSG.addAll]],
      hint:`List multiples of ${x[1]} and ${y[1]} to find the least common denominator.`,
      why:[`Least common denominator of ${x[1]} and ${y[1]}: ${L}.`,`${fr(...x)} = ${fr(...x2)} and ${fr(...y)} = ${fr(...y2)}.`,`${fr(...x2)} + ${fr(...y2)} = ${fr(x2[0]+y2[0],L)}`,`Simplest form: ${simp(ans)}`]})},
  sub(l){let x,y;do[x,y]=unlike(l);while(x[0]*y[1]<=y[0]*x[1]);const {L,x2,y2}=renamed(x,y),ans=sub(x,y);
    return FRAC({sec:'C',prompt:`Subtract. Give your answer in simplest form.<span class="big">${fr(...x)} − ${fr(...y)}</span>`,ans,
      traps:[[x[0]-y[0]>=0&&x[1]-y[1]>0?[x[0]-y[0],x[1]-y[1]]:null,MSG.subAll],[x[0]>y[0]?[x[0]-y[0],L]:null,MSG.noRename]],
      hint:`Rename both fractions with denominator ${L}.`,
      why:[`Least common denominator of ${x[1]} and ${y[1]}: ${L}.`,`${fr(...x)} = ${fr(...x2)} and ${fr(...y)} = ${fr(...y2)}.`,`${fr(...x2)} − ${fr(...y2)} = ${fr(x2[0]-y2[0],L)}`,`Simplest form: ${simp(ans)}`]})},
  wholeMinus(l){const w=R(1,l===1?2:5),[n,d]=properF(l),ans=sub(W(w),[n,d]);
    return FRAC({sec:'C',prompt:`Subtract. Give your answer in simplest form.<span class="big">${w} − ${fr(n,d)}</span>`,ans,
      traps:[[[w-1>0?(w-1)*d+n:n,d],`You wrote down the fraction you were taking away. Take 1 whole as ${fr(d,d)}: ${fr(d,d)} − ${fr(n,d)} = ${fr(d-n,d)}.`],[w>1?[w*d-n-d,d]:null,'Check the whole-number part: only one whole is broken into pieces.']],
      hint:`Write ${w} as ${w>1?(w-1)+' + ':''}${fr(d,d)}.`,
      why:[w>1?`${w} = ${w-1} + ${fr(d,d)}.`:`1 = ${fr(d,d)}.`,`${fr(d,d)} − ${fr(n,d)} = ${fr(d-n,d)}.`,`${w} − ${fr(n,d)} = ${simp(ans)}`]})},
  mixedAdd(l){const a=mixedOp(Math.max(1,l-1)),b=mixedOp(Math.max(1,l-1));if(a[2]===b[2])b[2]=b[2]===4?3:4;if(b[1]>=b[2]||gcd(b[1],b[2])!==1)b[1]=1;
    const minus=l===3&&coin(),A_=M(...a),B_=M(...b);if(minus&&A_[0]*B_[1]<=B_[0]*A_[1])return C.mixedAdd(l);
    const ans=minus?sub(A_,B_):add(A_,B_);
    return FRAC({sec:'C',prompt:`${minus?'Subtract':'Add'}. Give your answer as a mixed number in simplest form.<span class="big">${mx(...a)} ${minus?'−':'+'} ${mx(...b)}</span>`,ans,
      traps:[[minus?null:[ (a[0]+b[0])*(a[2]+b[2])+a[1]+b[1],a[2]+b[2]],MSG.addAll]],
      hint:minus?'Change both to improper fractions with a common denominator.':'Add the whole numbers, then add the fractions with a common denominator.',
      why:minus?[`${mx(...a)} = ${fr(...A_)} and ${mx(...b)} = ${fr(...B_)}.`,`Common denominator ${lcm(A_[1],B_[1])}: ${fr(A_[0]*lcm(A_[1],B_[1])/A_[1],lcm(A_[1],B_[1]))} − ${fr(B_[0]*lcm(A_[1],B_[1])/B_[1],lcm(A_[1],B_[1]))}.`,`= ${both(ans)}`]
        :[`Wholes: ${a[0]} + ${b[0]} = ${a[0]+b[0]}.`,`Fractions: ${fr(a[1],a[2])} + ${fr(b[1],b[2])} = ${both(add([a[1],a[2]],[b[1],b[2]]))}.`,`Total: ${simp(ans)}`]})},
  lcd(l){const [x,y]=unlike(Math.max(2,l)),L=lcm(x[1],y[1]),P=x[1]*y[1];
    const opts=[[String(L),''],[String(x[1]+y[1]),'Adding the denominators does not give a common denominator. List the multiples of each one.']];
    if(P!==L)opts.push([String(P),`${P} works, but it is not the <b>least</b> common denominator. ${L} is a smaller multiple of both.`]);
    opts.push([String(Math.max(x[1],y[1])),`${Math.max(x[1],y[1])} is not a multiple of ${Math.min(x[1],y[1])}.`]);if(opts.length<4)opts.push([String(L*2),`${L*2} is a common multiple but not the least one.`]);
    return MC({sec:'C',prompt:`What is the least common denominator of ${fr(...x)} and ${fr(...y)}?`,sym:true,opts,
      hint:`Multiples of ${Math.max(x[1],y[1])}: ${[1,2,3,4].map(i=>i*Math.max(x[1],y[1])).join(', ')}, … Which is the first one ${Math.min(x[1],y[1])} also divides?`,
      why:[`Multiples of ${x[1]}: ${[1,2,3,4,5].map(i=>i*x[1]).join(', ')}, …`,`Multiples of ${y[1]}: ${[1,2,3,4,5].map(i=>i*y[1]).join(', ')}, …`,`The first one in both lists is ${L}.`]})}
};

/* ---------- D · Whole numbers × ÷ fractions, reciprocals, the unit method ---------- */
const D_={
  mulWhole(l){const [n,d]=properF(l);const w=R(2,l===1?6:15);const ans=mul([n,d],W(w));const left=coin();
    return FRAC({sec:'D',prompt:`Evaluate. Give your answer in simplest form.<span class="big">${left?`${fr(n,d)}${X}${w}`:`${w}${X}${fr(n,d)}`}</span>`,ans,
      traps:[[[n,d],MSG.wholeBoth],[[n,d*w],'You multiplied the denominator. Multiply the numerator by the whole number (the pieces stay the same size).'],[[n+w,d],'That is adding, not multiplying.']],
      hint:`${w} = ${fr(w,1)}. Multiply the numerators.`,
      why:[`${fr(n,d)} × ${w} = ${fr(n+' × '+w,d)} = ${fr(n*w,d)}`,ans[1]===1||n*w>=d?`Simplify: ${both(red(n*w,d))}`:(gcd(n*w,d)>1?`Simplify: ${simp(ans)}`:'')]})},
  divWhole(l){const [n,d]=properF(l),w=R(2,l===1?6:12),ans=div(W(w),[n,d]);
    return FRAC({sec:'D',prompt:`Evaluate. Give your answer in simplest form.<span class="big">${w}${D}${fr(n,d)}</span>`,ans,
      traps:[[mul(W(w),[n,d]),MSG.noFlip],[mul(ans,W(d)),MSG.wholeAsDen],[red(n,w*d),MSG.flipFirst+` (${w} flipped is ${fr(1,w)}.)`],[red(d,n*w),MSG.flipBoth]],
      hint:`Dividing by ${fr(n,d)} is the same as multiplying by ${fr(d,n)}.`,
      why:[`Keep ${w}, change ÷ to ×, flip ${fr(n,d)} to ${fr(d,n)}.`,`${w} × ${fr(d,n)} = ${fr(w*d,n)}`,`Simplest form: ${simp(ans)}`]})},
  recip(l){const t=l===1?0:l===2?pick([0,1]):pick([1,2]);
    if(t===2){const [w,n,d]=mixedOp(2),f=M(w,n,d);
      return FRAC({sec:'D',prompt:`What is the reciprocal of ${mx(w,n,d)}?`,ans:[f[1],f[0]],form:'improper',
        traps:[[[w*n+d,n],'Change the mixed number to an improper fraction first, then flip it.'],[M(w,d,n),'Flip the whole improper fraction, not just the fraction part.']],
        hint:'Write it as an improper fraction first, then flip.',why:[`${mx(w,n,d)} = ${fr(...f)}.`,`Flip it: ${fr(f[1],f[0])}.`,`Check: ${fr(...f)} × ${fr(f[1],f[0])} = 1.`]})}
    if(t===1){const w=R(2,12);return FRAC({sec:'D',prompt:`What is the reciprocal of ${w}?`,ans:[1,w],form:'improper',traps:[[[w,1],'The reciprocal of a whole number is 1 over it.']],
      hint:`${w} = ${fr(w,1)}. Flip it.`,why:[`${w} = ${fr(w,1)}.`,`Flip: ${fr(1,w)}. Check: ${w} × ${fr(1,w)} = 1.`]})}
    const [n,d]=properF(l);return FRAC({sec:'D',prompt:`What is the reciprocal of ${fr(n,d)}?`,ans:[d,n],form:'improper',traps:[[[n,d],'That is the same fraction. Flip it: the denominator goes on top.']],
      hint:'Flip the fraction.',why:[`Flip ${fr(n,d)}: ${fr(d,n)}.`,`Check: ${fr(n,d)} × ${fr(d,n)} = 1.`]})},
  units(l){const T=[['tickets','ticket','$'],['books','book','$'],['notebooks','notebook','$'],['bus passes','bus pass','$'],['kg of apples','kg of apples','$']];
    const [pl,sg,cur]=pick(T),u=R(2,l===1?6:l===2?12:25),a=R(3,l===1?7:9);let b;do b=R(2,l===1?9:15);while(b===a);
    return INT({sec:'D',prompt:`${a} ${pl} cost $${a*u}. How much do ${b} ${pl} cost?`,ans:b*u,pre:'$',
      traps:[[a*u-(a-b),'You subtracted the difference in items from the cost. Find the cost of 1 first.'],[u,`$${u} is the cost of 1 ${sg}. Multiply by ${b}.`],[a*u+b,'Use the unit method: cost of 1, then multiply.']],
      hint:'Find the cost of 1 unit first.',why:[`${a} units → $${a*u}`,`1 unit → $${a*u} ÷ ${a} = $${u}`,`${b} units → ${b} × $${u} = $${b*u}`]})}
};

/* ---------- E · Proper fractions × ÷ proper fractions ---------- */
const E={
  mul(l){const x=properF(l),y=properF(l),ans=mul(x,y),can=gcd(x[0],y[1])>1||gcd(y[0],x[1])>1;
    return FRAC({sec:'E',prompt:`Evaluate. Give your answer in simplest form.<span class="big">${fr(...x)}${X}${fr(...y)}</span>`,ans,
      traps:[[div(x,y),MSG.crossMul],[[x[0]+y[0],x[1]+y[1]],'That is adding tops and bottoms. For ×, multiply top × top and bottom × bottom.']],
      hint:can?'Look for a numerator and a denominator that share a factor: cancel them first.':'Multiply the numerators, then the denominators.',
      why:[`${fr(x[0]+' × '+y[0],x[1]+' × '+y[1])} = ${fr(x[0]*y[0],x[1]*y[1])}`,gcd(x[0]*y[0],x[1]*y[1])>1?`Simplify (÷ ${gcd(x[0]*y[0],x[1]*y[1])}): ${simp(ans)}`:'',can?'Shortcut: cancel a numerator with a denominator before multiplying.':'']})},
  div(l){const x=properF(l),y=properF(l),ans=div(x,y);if(eq(x,y))return E.div(l);
    return FRAC({sec:'E',prompt:`Evaluate. Give your answer in simplest form.<span class="big">${fr(...x)}${D}${fr(...y)}</span>`,ans,
      traps:[[mul(x,y),MSG.noFlip],[mul([x[1],x[0]],y),MSG.flipFirst],[mul([x[1],x[0]],[y[1],y[0]]),MSG.flipBoth]],
      hint:`Keep ${fr(...x)}, change ÷ to ×, flip ${fr(...y)}.`,
      why:[`${fr(...x)} ÷ ${fr(...y)} = ${fr(...x)} × ${fr(y[1],y[0])}`,`= ${fr(x[0]*y[1],x[1]*y[0])}`,`Simplest form: ${simp(ans)}`]})},
  same(l){const x=properF(l),y=properF(l);if(eq(x,y))return E.same(l);
    return MC({sec:'E',prompt:`Which is the same as ${fr(...x)}${D}${fr(...y)}?`,
      opts:[[`${fr(...x)}${X}${fr(y[1],y[0])}`,''],[`${fr(x[1],x[0])}${X}${fr(...y)}`,MSG.flipFirst],[`${fr(...x)}${X}${fr(...y)}`,MSG.noFlip],[`${fr(x[1],x[0])}${X}${fr(y[1],y[0])}`,MSG.flipBoth]],
      hint:'Keep · change · flip.',why:['Keep the first fraction.','Change ÷ to ×.',`Flip the second: ${fr(...y)} becomes ${fr(y[1],y[0])}.`]})},
  ofWord(l){const T=[['A pizza is cut up. %A of it is left. You eat %B of what is left. What fraction of the whole pizza did you eat?','×'],['%A of a class plays a sport. %B of those play soccer. What fraction of the class plays soccer?','×'],['A ribbon is %A m long. It is cut into pieces that are each %B m long. How many pieces are there?','÷']];
