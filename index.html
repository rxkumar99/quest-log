/* ---------- F · Lesson 3.1 Multiplying improper fractions and mixed numbers ---------- */
function improperF(l){const d=pick(l===1?[2,3,4,5]:l===2?[3,4,5,6,7,8]:[6,8,9,10,11,12]);let n;do n=R(d+1,d*(l===1?3:l===2?4:6));while(gcd(n,d)!==1&&l<3||n%d===0);return opF(n,d)}
function mixedO(l){const [w,n,d]=mixedOp(l);return opM(w,n,d)}
function properO(l){const [n,d]=properF(l);return opF(n,d)}
const crossCancel=(a,b)=>{const g1=gcd(a[0],b[1]),g2=gcd(b[0],a[1]);return (g1>1||g2>1)?`Cancel first: ${g1>1?`${a[0]} and ${b[1]} share ${g1}`:''}${g1>1&&g2>1?'; ':''}${g2>1?`${b[0]} and ${a[1]} share ${g2}`:''}. ${fr(a[0]/g1,a[1]/g2)} × ${fr(b[0]/g2,b[1]/g1)} = ${fr(a[0]*b[0]/g1/g2,a[1]*b[1]/g1/g2)}`:''};
function product(x,y,extra){
  const ans=mul(x.f,y.f),a=x.imp,b=y.imp;
  const traps=[];
  const cw=(x.w&&!x.whole?x.w:0)||(y.w&&!y.whole?y.w:0);
  if(x.w&&!x.whole&&y.w&&!y.whole)traps.push([add(W(x.w*y.w),mul([x.raw[0],x.raw[1]],[y.raw[0],y.raw[1]])),MSG.wholeTimesWhole]);
  else if(x.w&&!x.whole)traps.push([add(W(x.w),mul([x.raw[0],x.raw[1]],y.f)),MSG.caution]);
  else if(y.w&&!y.whole)traps.push([add(W(y.w),mul(x.f,[y.raw[0],y.raw[1]])),MSG.caution]);
  traps.push([div(x.f,y.f),MSG.crossMul]);
  if(x.w&&!x.whole)traps.push([mul([x.w*x.raw[0]+x.raw[1],x.raw[1]],y.f),MSG.toImp+` (${x.h} = ${fr(...x.imp)})`]);
  if(y.w&&!y.whole)traps.push([mul(x.f,[y.w*y.raw[0]+y.raw[1],y.raw[1]]),MSG.toImp+` (${y.h} = ${fr(...y.imp)})`]);
  return FRAC(Object.assign({sec:'F',prompt:`${extra||'Multiply. Give your answer in simplest form (a whole or mixed number).'}<span class="big">${x.h}${X}${y.h}</span>`,ans,traps,
    fallback:cw?'Check each step: change mixed numbers to improper fractions, cancel common factors, multiply, then simplify.':'',
    hint:cw?'Change every mixed number to an improper fraction first.':'Cancel a numerator with a denominator if they share a factor, then multiply.',
    why:[x.w&&!x.whole?`${x.h} = ${fr(...a)}`:'',y.w&&!y.whole?`${y.h} = ${fr(...b)}`:'',
      `${fr(...a)} × ${fr(...b)} = ${fr(a[0]+' × '+b[0],a[1]+' × '+b[1])} = ${fr(a[0]*b[0],a[1]*b[1])}`,
      crossCancel(a,b),`Simplest form: ${simp(ans)}`]},{}));
}
const BOOK31=[['m',2,1,4,'f',10,3],['f',1,3,'f',7,5],['f',2,7,'m',1,9,12],['f',3,7,'f',14,5],['f',5,9,'f',24,7],['m',1,2,5,'f',9,2],['f',27,6,'f',15,8],['m',5,1,3,'f',9,4],
  ['m',3,4,6,'f',3,11],['f',15,6,'f',4,5],['f',21,8,'f',10,7],['m',2,8,12,'f',15,4],['f',17,3,'f',21,5],['m',1,6,9,'m',3,2,3],['f',28,11,'m',3,8,12],['f',23,10,'f',11,3]];
function bookOp(a){const out=[];let i=0;while(i<a.length){if(a[i]==='m'){out.push(opM(a[i+1],a[i+2],a[i+3]));i+=4}else{out.push(opF(a[i+1],a[i+2]));i+=3}}return out}
const F={
  impProper(l){let x=improperF(l),y=properO(l);if(coin())[x,y]=[y,x];return product(x,y)},
  mixProper(l){let x=mixedO(l),y=properO(l);if(coin())[x,y]=[y,x];return product(x,y)},
  impImp(l){return product(improperF(l),improperF(l))},
  mixMix(l){let x=mixedO(Math.max(1,l-1)),y=coin(l===3?.7:.4)?mixedO(Math.max(1,l-1)):improperF(l);if(coin())[x,y]=[y,x];return product(x,y)},
  book(){const [x,y]=bookOp(pick(BOOK31));const q=product(x,y);q.book=true;return q},
  cancel(l){let a,b,g;do{a=improperF(Math.max(2,l)).imp;b=properO(Math.max(2,l)).imp;g=gcd(a[0],b[1])}while(g<2||gcd(b[0],a[1])>1);
    const right=`${fr(a[0]/g,a[1])}${X}${fr(b[0],b[1]/g)}`,gn=gcd(a[0],b[0]);
    return MC({sec:'F',prompt:`Which shows ${fr(...a)}${X}${fr(...b)} simplified correctly <b>before</b> multiplying?`,
      opts:[[right,''],[`${fr(a[0]/g,a[1])}${X}${fr(...b)}`,`You divided only ${a[0]} by ${g}. When you cancel, divide a numerator <b>and</b> a denominator by the same number.`],
        gn>1?[`${fr(a[0]/gn,a[1])}${X}${fr(b[0]/gn,b[1])}`,'You cancelled two numerators. Cancel a numerator with a <b>denominator</b>.']:null,
        [`${fr(a[0]/g,a[1])}${X}${fr(b[0],b[1]*g)}`,`You divided ${a[0]} by ${g} but multiplied ${b[1]} by ${g}. Divide <b>both</b> by ${g}.`],
        [`${fr(a[0],a[1])}${X}${fr(b[0],b[1]/g)}`,`You divided only ${b[1]} by ${g}. Divide the numerator ${a[0]} by ${g} as well.`]].filter(Boolean),
      hint:`Which numerator and which denominator share a factor?`,
      why:[`${a[0]} (a numerator) and ${b[1]} (a denominator) share the factor ${g}.`,`${a[0]} ÷ ${g} = ${a[0]/g} and ${b[1]} ÷ ${g} = ${b[1]/g}.`,`${right} = ${both(mul(a,b))}`]})},
  word(l){const [w,n,d]=mixedOp(Math.min(l,2)),f=properF(Math.min(l,2));
    const T=[[`Your family has ${mx(w,n,d)} plots in a community garden. You plant carrots in ${fr(...f)} of your share. What fraction of one plot is used for carrots?`,'plot'],
      [`A recipe needs ${mx(w,n,d)} cups of flour. You make ${fr(...f)} of the recipe. How many cups of flour do you need?`,'cups'],
      [`A hiking trail is ${mx(w,n,d)} km long. You have walked ${fr(...f)} of it. How far have you walked?`,'km'],
      [`A jug holds ${mx(w,n,d)} L of juice. ${fr(...f)} of it is poured into glasses. How many litres are poured?`,'L']];
    const [t,u]=pick(T),x=opM(w,n,d),y=opF(...f),q=product(x,y,t+' Give your answer in simplest form.');
    q.prompt=t+' Give your answer in simplest form.';
    q.why=[`“${fr(...f)} of ${mx(w,n,d)}” means ${fr(...f)} × ${mx(w,n,d)}.`,`${mx(w,n,d)} = ${fr(...x.imp)}`,`${fr(...f)} × ${fr(...x.imp)} = ${fr(f[0]*x.imp[0],f[1]*x.imp[1])}`,`Answer: ${simp(q.ans)}${u==='plot'?' of a plot':' '+u}`];
    q.explain=()=>ol(q.why);return q}
};

/* n keys from a topic: every question type appears before any repeats */
function deal(id,n){let out=[];while(out.length<n)out=out.concat(shuffle(keysOf(id)));return out.slice(0,n)}
function planFor(mode,arg){
  if(mode==='practice'){const lv=level(arg);return deal(arg,10).map(k=>({k,l:lv}))}
  if(mode==='test')return shuffle(deal(arg,12)).map((k,i)=>({k,l:i<4?2:3}));
  if(mode==='warm'){const p=dueReviews().slice(0,3).map(r=>({k:r.k,l:level(r.k[0]),rev:true}));
    const started=SECTIONS.filter(s=>ss(s.id).m.length||ss(s.id).read).map(s=>s.id);const pool=(started.length?started:SECTIONS.map(s=>s.id));
    while(p.length<5){const s=pick(pool);p.push({k:pick(keysOf(s)),l:level(s)})}return shuffle(p)}
  const e=EXAMS.find(x=>x.id===arg);const per=e.id==='final'?{A:3,B:3,C:5,D:5,E:5,F:9}:{A:2,B:2,C:3,D:3,E:4,F:6};
  let ks=[];Object.entries(per).forEach(([s,n])=>{ks=ks.concat(deal(s,n))});
  if(e.id==='final'){['F.mixMix','F.word','E.div','D.divWhole','C.mixedAdd'].forEach((k,i)=>{ks[ks.length-1-i]=k})}
  ks=shuffle(ks);return ks.map((k,i)=>({k,l:e.lv[Math.min(2,Math.floor(i/(ks.length/3)))]}));
}

function readAnswer(q,choice){
  if(q.kind==='mc'){const i=choice!=null?choice:S.sel;if(i==null)return {err:'Choose an answer first.'};return {ok:i===q.ans,shown:q.choices[i],ua:i,note:i!==q.ans&&q.diag?q.diag(i):''}}
  if(q.kind==='int'){const raw=val('fr-i').replace(/[\s$,]/g,'');if(!raw)return {err:'Type your answer first.'};if(!/^\d+$/.test(raw))return {err:'Type a whole number.'};
    return {ok:q.check(raw),shown:(q.pre||'')+raw,note:q.diag(raw)}}
  const u={w:val('fr-w'),n:val('fr-n'),d:val('fr-d')},p=parse(u);if(p.err)return {err:p.err};
  return {ok:q.check(u),shown:userHtml(p),note:q.diag(u)};
}
function check(choice){
  if(S.answered)return;const e=S.plan[S.i],q=e.q,msg=$('#fr-msg');const r=readAnswer(q,choice);
  if(r.err){msg.textContent=r.err;return}
  msg.textContent='';S.answered=true;
  const lid=q.sec;if(S.mode==='practice'||S.mode==='warm'){ss(lid).m=(ss(lid).m||[]).concat(r.ok?1:0).slice(-20)}
  if(r.ok){S.score++;S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=S.deferred?15:10;if(e.rev&&reviewHit(q.key))S.xp+=5}
  else{S.streak=0;S.xp+=2;miss(q.key)}
  S.log.push({q,ok:r.ok,shown:r.shown,note:r.note,e});
  if(S.best>=8)M.badges.fire=true;
  save();
  if(S.deferred){next();return}
  let added=false;
  if(!r.ok&&S.extra<4){S.plan.push({k:q.key,l:Math.max(1,(e.l||1)),retry:true});S.extra++;added=true}
  root.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===r.ua)b.classList.add(r.ok?'picked-ok':'picked-no');else if(i===q.ans)b.classList.add('right')});
  root.querySelectorAll('.num').forEach(x=>x.disabled=true);
  const hb=$('#fr-hintBtn');if(hb)hb.disabled=true;
  const work=q.explain();
  $('#fr-fb').innerHTML=r.ok?`<div class="fb ok"><p class="fbh">Correct${S.streak>=3?` · ${S.streak} in a row 🔥`:''} <span class="xpf">+${10+(e.rev?5:0)} XP</span></p><details><summary>See why</summary>${work}</details></div>`
    :`<div class="fb no"><p class="fbh">Not quite</p><p>You answered: <b>${r.shown}</b><br>Correct answer: <b>${q.answerText}</b></p>${r.note?`<p class="watch"><b>What went wrong:</b> ${r.note}</p>`:''}<p style="font-weight:700">How to get there</p>${work}${added?'<p class="added">A similar question has been added to the end of this round. It will also come back in your Daily Warm-up.</p>':'<p class="added">This skill will come back in your Daily Warm-up.</p>'}</div>`;
  const last=S.i===S.plan.length-1;
  $('#fr-actions').innerHTML=`<button class="btn primary" type="button" id="fr-next">${last?'See results':'Next question →'}</button>`;
  $('#fr-next').focus({preventScroll:true});
  $('#fr-fb').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'nearest'});
}
function next(){if(S.i<S.plan.length-1){S.i++;showQ();window.scrollTo(0,0)}else end()}

/* ---------- results ---------- */
function end(){
  stopTimer();const total=S.log.length,pct=Math.round(S.score/(S.deferred?S.plan.length:total)*100);
  let headline='',bonus=0;
  if(S.mode==='practice'){bonus=20;M.badges.first=true;headline=mast(S.sec).expert?'Expert in this topic! Take the topic test when you’re ready.':pct>=70?'Good round. Another one will push you towards Expert.':'Keep going. Read the “What went wrong” notes, then try again.'}
  if(S.mode==='warm'){bonus=20;headline=`Warm-up done. Streak: ${streak()+(M.days.includes(TODAY())?0:1)} day${streak()===0?'':'s'} 🔥`}
  if(S.mode==='test'){const st=ss(S.sec);st.tests=(st.tests||0)+1;const nb=pct>st.test;st.test=Math.max(st.test,pct);bonus=pct>=PASS.test?50:10;
    headline=pct>=PASS.test?`Passed! ${mastered(S.sec)?'Topic mastered ✓':'Get to Expert in practice to master the topic.'}`:'Not 80% yet. Practise the questions you missed, then try again.';if(nb&&pct>=PASS.test)headline+=' New best!'}
  if(S.mode==='exam'){const id=S.arg,r=M.ex[id]||{best:0,tries:0};const nb=pct>r.best;M.ex[id]={best:Math.max(r.best,pct),tries:r.tries+1,last:pct};const pass=id==='final'?PASS.final:PASS.exam;bonus=pct>=pass?(id==='final'?300:100):20;
    headline=pct>=pass?(id==='final'?'🏆 Expert Grade 8 level. Outstanding!':'Passed! On to the next exam.'):`You need ${pass}% to pass. Review every mistake below, then try again: the questions change every time.`;if(nb)headline+=' New best score!'}
  M.xp+=S.xp+bonus;markDay();if(streak()>=7)M.badges.week=true;save();
  if((S.mode==='exam'||S.mode==='test')&&pct>=80&&window.boom)boom();
  const by={};S.log.forEach(r=>{const s=r.q.sec;by[s]=by[s]||{r:0,t:0};by[s].t++;if(r.ok)by[s].r++});
  const weakest=Object.entries(by).sort((a,b)=>a[1].r/a[1].t-b[1].r/b[1].t)[0];
  const rv=(r,i)=>`<div class="rv${r.ok?'':' no'}"><div class="h"><span class="qn">Q${i+1}</span><b>${r.ok?'✓':'✗'}</b><span style="font-size:.85rem;color:var(--muted)">${esc(lessonName(r.q.sec))}</span></div><div>${r.q.prompt}</div>
    <div>You answered: <b>${r.shown}</b>${r.ok?'':`<br>Correct answer: <b>${r.q.answerText}</b>`}</div>${r.ok?`<details><summary>See why</summary>${r.q.explain()}</details>`:`${r.note?`<p class="watch" style="margin:0"><b>What went wrong:</b> ${r.note}</p>`:''}${r.q.explain()}`}</div>`;
  const review=S.log.map((r,i)=>S.deferred||!r.ok?rv(r,i):'').join('');
  app.innerHTML=`<section class="end">
    <p class="eyebrow">${esc(titleOf())} · complete${S.deferred?' · time '+clock():''}</p>
    <div class="bigscore">${S.score}<span style="color:var(--muted);font-size:.45em"> / ${S.deferred?S.plan.length:total}${S.deferred?` · ${pct}%`:''}</span></div>
    <p style="margin:0;max-width:62ch;font-weight:600">${headline}</p>
    <p style="margin:0" class="xpf">+${S.xp+bonus} XP · ${esc(rank().name)}</p>
    <div>${Object.entries(by).map(([k,v])=>`<div class="bkrow"><span>${esc(lessonName(k))} · ${esc(secOf(k).name)}</span><span>${v.r}/${v.t}</span></div>`).join('')}</div>
    <div class="cta">${weakest&&weakest[1].r<weakest[1].t?`<button class="btn primary" type="button" data-sec="${weakest[0]}">Practise ${esc(lessonName(weakest[0]))}</button>`:''}
      <button class="btn" type="button" data-act="again">Try again (new questions)</button><button class="btn ghost" type="button" data-tabgo="${S.mode==='exam'?'exams':S.mode==='warm'?'today':'lessons'}">Done</button></div>
    ${review?`<h2 class="sec" style="margin-top:6px">${S.deferred?'Review every question':'Questions to look at again'}</h2><div style="display:grid;gap:8px">${review}</div>`:''}
  </section>`;
  S.view='end';window.scrollTo(0,0);
}

/* ---------- events (scoped to the trainer) ---------- */
root.addEventListener('click',ev=>{
  const fl=ev.target.closest('.flip');if(fl&&root.contains(fl)){fl.classList.toggle('open');return}
  const t=ev.target.closest('button');if(!t||!root.contains(t))return;
  if(t.dataset.tab)return home(t.dataset.tab);
  if(t.dataset.tabgo)return home(t.dataset.tabgo);
  if(t.dataset.start){S.sec=t.dataset.sid;ss(S.sec).read=true;save();return intro(t.dataset.start,t.dataset.sid)}
  if(t.classList.contains('choice')){if(S.deferred){root.querySelectorAll('.choice').forEach(b=>b.classList.toggle('sel',b===t));S.sel=+t.dataset.i;return}return check(+t.dataset.i)}
  if(t.id==='fr-check')return check();
  if(t.id==='fr-next')return next();
  if(t.id==='fr-hintBtn'){$('#fr-hint').hidden=false;t.disabled=true;return}
  if(t.dataset.sec)return section(t.dataset.sec);
  if(t.dataset.exam)return intro('exam',t.dataset.exam);
  if(t.dataset.go){const g=t.dataset.go;if(g==='practice'||g==='test'){ss(S.sec).read=true;save();return start(g,S.sec)}return start('exam',S.exam)}
  const a=t.dataset.act;
  if(a==='back')return section(S.sec);
  if(a==='warm')return start('warm');
  if(a==='practice'){ss(S.sec).read=true;save();return intro('practice',S.sec)}
  if(a==='test'){ss(S.sec).read=true;save();return intro('test',S.sec)}
  if(a==='quit'){if(S.log.length===0||confirm('Leave this round? Answers so far are kept in your progress.')){return S.sec?section(S.sec):home(S.mode==='exam'?'exams':'today')}return}
  if(a==='again')return S.mode==='practice'||S.mode==='test'?intro(S.mode,S.sec):S.mode==='exam'?intro('exam',S.arg):start('warm');
});
document.addEventListener('keydown',ev=>{
  if(root.hidden||ev.key!=='Enter'||S.view!=='quiz'||!(root.contains(ev.target)||ev.target===document.body))return;
  if(ev.target.classList&&ev.target.classList.contains('num')&&!S.answered){ev.preventDefault();
    const boxes=[...root.querySelectorAll('.num')],i=boxes.indexOf(ev.target),nxt=boxes.slice(i+1).find(b=>!b.value);
    if(nxt&&ev.target.value)nxt.focus();else check();return}
  if(S.answered&&ev.target.id!=='fr-next'){ev.preventDefault();next()}
});

window.FRAC={
  get:()=>M,
  apply:d=>{M=Object.assign({sec:{},ex:{},rev:[],xp:0,days:[],badges:{},retired:0},d);persist();if(S.view==='home')home();syncQuest()},
  hasData:()=>M.xp>0||Object.keys(M.sec).length>0,
  show:()=>{if(S.view!=='quiz')home()},
  _q:()=>S.view==='quiz'?S.plan[S.i].q:null
};
home();
})();

<script type="text/plain" id="appJs2">

/* ---------- Online saving (Claude page database) ---------- */
// Progress lives in two shared documents so it follows the student to any device:
//   progress/quest  = Quest Log state   ·   progress/french = French Trainer state
const SYNC={db:null};
const SYNC_TXT={local:'Saved on this device', online:'Saved online ✓', saving:'Saving…', error:'Offline · will retry', readonly:'View only'};
function setSync(s){ const el=$('#syncStatus'); if(el){ el.dataset.s=s; el.textContent=SYNC_TXT[s]; } }
function channel(path, get, apply, hasData){
  // SAFETY: nothing is written until the saved copy has been loaded (ready). Writing earlier would
  // replace the real progress with this page's empty starting copy.
  let timer=null, writing=false, again=false, lastSent=null, ready=false, pending=false;
  async function flush(){
    if(!SYNC.db) return;
    if(!ready){ pending=true; return; }
    if(writing){ again=true; return; }
    writing=true; setSync('saving');
    try{ const body=JSON.parse(JSON.stringify(get())); lastSent=JSON.stringify(body); await SYNC.db.doc(path).set(body); setSync('online'); }
    catch(e){ if(e&&e.code==='invalid_argument') setSync('readonly'); else { setSync('error'); setTimeout(flush, 4000+Math.random()*3000); } }
    writing=false;
    if(again){ again=false; flush(); }
  }
  async function dailyBackup(data){
    // one copy per day, e.g. progress/backup-quest-2026-09-30, so progress can always be recovered
    try{ const id='backup-'+path.split('/')[1]+'-'+ymd(today()); const b=SYNC.db.doc('progress/'+id); const s=await b.get(); if(!s.exists) await b.set({savedAt:new Date().toISOString(), data}); }catch(e){}
  }
  return {
    push(){ clearTimeout(timer); timer=setTimeout(flush, 800); },
    async attach(){
      const ref=SYNC.db.doc(path);
      for(let attempt=0; attempt<3 && !ready; attempt++){
        try{
          const snap=await ref.get({source:'server'});
          if(snap.exists){ const js=JSON.stringify(snap.data()); lastSent=js; apply(JSON.parse(js)); dailyBackup(JSON.parse(js)); }
          ready=true;
          if(!snap.exists && hasData()) await flush();
        }catch(e){ setSync('error'); await new Promise(r=>setTimeout(r, 3000)); }
      }
      if(!ready) return;          // could not load: stay read-only for this visit rather than risk overwriting
      pending=false;              // changes made before loading were applied to the empty copy; drop them
      setSync('online');
      ref.onSnapshot(snap=>{
        if(!snap.exists || snap.metadata.hasPendingWrites) return;
        const js=JSON.stringify(snap.data());
        if(js===lastSent || js===JSON.stringify(get())) return;
        lastSent=js; apply(JSON.parse(js));
      }, ()=>setSync('error'));
    }
  };
}
window.QUEST_CH=channel('progress/quest', ()=>store,
  d=>{ store=Object.assign({state:{},custom:[],dueOverride:{},deleted:{}}, d); try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} renderAll(); },
  ()=>Object.keys(store.state).length>0||store.custom.length>0||Object.keys(store.deleted||{}).length>0);
window.FR_CH=channel('progress/french', ()=>window.FR.get(), d=>window.FR.apply(d), ()=>window.FR.hasData());
window.ROOTS_CH=channel('progress/roots', ()=>window.ROOTS.get(), d=>window.ROOTS.apply(d), ()=>window.ROOTS.hasData());
window.VOICE_CH=channel('progress/voice', ()=>window.VOICE.get(), d=>window.VOICE.apply(d), ()=>window.VOICE.hasData());
window.MATH_CH=channel('progress/math', ()=>window.MATH.get(), d=>window.MATH.apply(d), ()=>window.MATH.hasData());
window.FRAC_CH=channel('progress/fractions', ()=>window.FRAC.get(), d=>window.FRAC.apply(d), ()=>window.FRAC.hasData());
(async()=>{
  const db = window.FB_DB || null;
  if(!db) return; // opened as a local file: keeps saving in this browser
  SYNC.db=db; setSync('online');
  document.querySelectorAll('.local-only').forEach(el=>el.hidden=true);
  $('#questFoot').textContent='Progress saves online automatically and follows you to any device. Classroom links open with the account that\'s signed in to Google.';
  await QUEST_CH.attach(); await FR_CH.attach(); await ROOTS_CH.attach(); await VOICE_CH.attach(); await MATH_CH.attach(); await FRAC_CH.attach();
})();
if(location.hash==='#french') showScreen('french');
if(location.hash==='#roots') showScreen('roots');
if(location.hash==='#voice') showScreen('voice');
if(location.hash==='#math') showScreen('math');
if(location.hash==='#fractions') showScreen('fractions');
if(location.hash.startsWith('#papa-')) showScreen(location.hash.slice(1));
</script>

const FIREBASE_CONFIG = {"apiKey": "AIzaSyANOoTB9MZh0w2PqtqmSPJfP3g0Vpqr0u0", "authDomain": "quest-log-1f157.firebaseapp.com", "projectId": "quest-log-1f157", "storageBucket": "quest-log-1f157.firebasestorage.app", "messagingSenderId": "484956649879", "appId": "1:484956649879:web:7030b8767cc8218e07ecd2"};

firebase.initializeApp(FIREBASE_CONFIG);
const FB_AUTH = firebase.auth();
window.FB_DB = firebase.firestore();
const g = id => document.getElementById(id);
let started = false;

function gateMessage(text, err){ const m=g('gateMsg'); m.textContent=text; m.className='gate-msg'+(err?' err':''); }
g('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  g('gBtn').disabled = true; gateMessage('Signing in…');

  }

});
g('setupSignOut').onclick = () => FB_AUTH.signOut();

async function applyDataFile(file, msgEl){
  const d = JSON.parse(await file.text());
  if(!d || typeof d.dataJs!=='string' || typeof d.reviewsJs!=='string' || !d.profile) throw new Error('This is not a Quest Log data file.');
  await FB_DB.doc('dashboard/main').set({profile:d.profile, dataJs:d.dataJs, reviewsJs:d.reviewsJs, updatedAt:new Date().toISOString()});
  // Progress is only seeded the first time; it never overwrites saved progress.
  for (const k of ['quest','french']) {
    if (d.progress && d.progress[k]) {
      const ref = FB_DB.doc('progress/'+k); const snap = await ref.get();
      if (!snap.exists) await ref.set(d.progress[k]);
    }
  }
  if (msgEl) msgEl.textContent = 'Loaded. Opening the dashboard…';
  location.reload();
}
g('setupFile').onchange = e => { const f=e.target.files[0]; if(f) applyDataFile(f, g('setupMsg')).catch(err=>{ g('setupMsg').textContent=err.message; g('setupMsg').className='gate-msg err'; }); };
g('applyFile').onchange = e => { const f=e.target.files[0]; if(f) applyDataFile(f).catch(err=>alert(err.message)); e.target.value=''; };

function fill(text, p){
  return text.replaceAll('__NAME__', p.name||'').replaceAll('__SCHOOLLINE__', p.schoolLine||'')
             .replaceAll('__FRTEACHER__', p.frTeacher||'your teacher').replaceAll('__FRVIDEO__', p.frVideo||'#');
}
function runScript(code){ const s=document.createElement('script'); s.textContent=code; document.body.appendChild(s); }

function startDashboard(d, user){
  if (started) return; started = true;
  const p = d.profile || {};
  document.title = fill("__NAME__'s Quest Log", p);

  try {
    const snap = await FB_DB.doc('dashboard/main').get();
    if (!snap.exists) {

      else gateMessage('The dashboard isn\'t set up yet. Ask a parent to load it.', true);
      return;
    }
    startDashboard(snap.data(), user);
  } catch (err) {
    gateMessage(err && err.code==='permission-denied' ? 'This account doesn\'t have access to the dashboard.' : 'Could not load the dashboard (' + (err.code||err.message) + ').', true);
    await FB_AUTH.signOut();
  }
});
