<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest Log</title>
<script>try{document.documentElement.setAttribute('data-skin',localStorage.getItem('ql-skin')||'classic')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Libre+Baskerville:wght@400;700&family=Lora:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#E9EEF5; --ink:#18223D; --muted:#5B6782; --line:#D5DDE8;
  --accent:#0E8A8C; --accent-ink:#FFFFFF; --accent-soft:#D5F0EF;
  --gold:#E9A23B; --gold-soft:#FCEFD8;
  --danger:#D6452A; --danger-soft:#FBE2DC;
  --good:#2E9E5B; --good-soft:#DDF3E5;
  --s-social:#B5542C; --s-arts:#8A4FD1; --s-music:#D0417E; --s-math:#2563C9; --s-science:#1C8F5A; --s-french:#C28A12; --s-home:#4F6480; --s-event:#6B7690;
  --shadow:0 1px 2px rgba(24,34,61,.06),0 6px 20px rgba(24,34,61,.07);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 60px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Header */
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.top h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.02em}
.top h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}

/* Progress counts */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats-row .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:baseline;gap:8px}
.stats-row .stat b{font-family:var(--mono);font-size:24px;line-height:1}
.stats-row .stat span{font-size:13.5px;color:var(--muted);font-weight:600}
.stats-row .stat.warn b{color:var(--danger)}
/* Rank panel (unused) */
.rank{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:var(--ink);color:var(--bg);border-radius:18px;padding:18px 22px;position:relative;overflow:hidden}
.rank::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.05) 47px 48px),repeating-linear-gradient(0deg,transparent 0 47px,rgba(255,255,255,.05) 47px 48px);pointer-events:none}
.medal{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#2B1B00;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.rank-name{font-family:var(--display);font-size:24px;font-weight:800}
.rank .label{color:inherit;opacity:.7}
.xpbar{height:12px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFD98A);border-radius:99px;transition:width .6s ease}
.xptext{font-size:13px;opacity:.8;margin-top:6px}
.stats{display:flex;gap:22px;position:relative;z-index:1}
.stat{text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:26px;line-height:1.1}
.stat span{font-size:12px;opacity:.75}
.stat.warn b{color:#FF9B82}

/* Next up */
.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:grid;gap:6px;box-shadow:var(--shadow);border-top:4px solid var(--c,var(--accent))}
.ncard:hover{transform:translateY(-2px);transition:transform .15s}
.ncard h3{font-size:17px}
.ncard .when{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.count{font-family:var(--mono);font-weight:700;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.count.hot{background:var(--danger-soft);color:var(--danger)}
.count.soon{background:var(--gold-soft);color:var(--ink)}
.count.ok{background:var(--good-soft);color:var(--good)}

/* Tabs */
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-head h2{font-size:22px}
.cal-nav{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{opacity:.4}
.day.today{border:2px solid var(--accent);background:var(--accent-soft)}
.day.sel{outline:2px solid var(--gold);outline-offset:1px}
.day .num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}
.day.today .num{color:var(--accent)}
.chip{display:block;font-size:11.5px;font-weight:600;line-height:1.25;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{text-decoration:line-through;opacity:.55}
.chip.event{background:transparent;border:1px dashed var(--c);border-left-width:1px}
.chip.late{background:var(--danger-soft);border-left-color:var(--danger)}
.more{font-size:11px;color:var(--muted);font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

.side h3{font-size:18px;margin-bottom:10px}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.item:hover{border-color:var(--c)}
.item .sw{width:10px;align-self:stretch;border-radius:4px;background:var(--c)}
.item .t{font-weight:700;line-height:1.25}
.item .m{font-size:12.5px;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item.event{border-style:dashed}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}

/* List view */
.groups{display:grid;gap:22px}
.group h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.group h3 .n{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 8px;border-radius:99px}
.group.late h3{color:var(--danger)}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.badge{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:6px;justify-items:start}
.badge .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;background:var(--surface-2);color:var(--muted)}
.badge.on .ico{background:var(--gold);color:#2B1B00}
.badge.off{opacity:.6}
.badge h4{margin:0;font-family:var(--display);font-size:16px}
.badge p{margin:0;font-size:13px;color:var(--muted)}

/* Modal */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,28,.55)}
.m-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);border-top:6px solid var(--c,var(--accent));display:grid;gap:8px;position:relative}
.m-head h2{font-size:24px;padding-right:36px}
.close{position:absolute;right:14px;top:14px;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2)}
.tag.subj{background:color-mix(in srgb,var(--c) 18%,transparent)}
.tag.xp{background:var(--gold-soft)}
.m-body{padding:18px 22px;display:grid;gap:18px;overflow:auto}
.m-body p{margin:0}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--surface-2);cursor:pointer}
.steps input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.steps label.ck span{text-decoration:line-through;color:var(--muted)}
.minibar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.links{display:grid;gap:8px}
.link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
.link:hover{border-color:var(--accent);background:var(--accent-soft)}
.link .kind{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);min-width:44px;text-align:center}
.link .arrow{margin-left:auto;color:var(--muted)}
.link.study{background:var(--gold-soft);border-color:var(--gold)}
.link.study .kind{background:var(--gold);color:#2B1B00}
.rubric{display:grid;gap:6px}
.rubric div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:10px}
.m-foot{padding:14px 22px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.m-foot .row{display:flex;gap:8px;flex-wrap:wrap}
.donebox{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--good-soft);color:var(--ink);font-weight:600}
.donebox b{color:var(--good)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}

/* Form */
form.add{display:grid;gap:12px}
form.add label{display:grid;gap:4px;font-size:13px;font-weight:600}
form.add input,form.add select,form.add textarea{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.foot{font-size:12.5px;color:var(--muted);text-align:center}

@media (max-width:900px){
  .cal-layout{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top{grid-template-columns:1fr}
  .toolbar{justify-content:flex-start}
  .rank{grid-template-columns:auto 1fr;padding:16px}
  .stats{grid-column:1/-1;justify-content:space-around}
  .day{min-height:54px;padding:4px}
  .day .chip,.day .more{display:none}
  .dots{display:flex}
  .two{grid-template-columns:1fr}
  .grid{gap:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.mission{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mission summary{list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;cursor:pointer;border-radius:12px}
.mission summary::-webkit-details-marker{display:none}
.mission summary:hover{background:var(--surface-2)}
.mission summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mission .chev{transition:transform .2s;color:var(--muted);font-size:13px}
.mission[open] .chev{transform:rotate(90deg)}
.mission-bar{flex-basis:100%;height:6px}
.mission .steps{padding:0 12px 12px}
.refreshed{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--muted);font-family:var(--mono)}
.refreshed::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}

/* ---------- Work-in-progress button + Papa Review ---------- */
.wip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg);text-decoration:none}
.wip:hover{outline:3px solid var(--gold)}
.wip-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#2B1B00;padding:4px 8px;border-radius:6px}
.wip-name{font-weight:700}
.wip-go{font-weight:700;color:var(--gold)}
.link.review{background:var(--accent-soft);border-color:var(--accent)}
.link.review .kind{background:var(--accent);color:var(--accent-ink)}
#reviewApp .wrap{max-width:900px}
.rv-head{display:grid;gap:6px}
.rv-head h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
.rv-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rv-crit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.rv-crit .lv{font-family:var(--mono);font-weight:700;font-size:14px}
.rv-crit .lv b{color:var(--accent)}
.rv-prio{background:var(--gold-soft);border-radius:14px;padding:16px 18px}
.rv-prio ol{margin:8px 0 0;padding-left:22px;display:grid;gap:6px}
.rv-slide{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.rv-slide.focus{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.rv-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rv-num{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-weight:700;flex:none}
.rv-top h3{font-size:19px;flex:1;min-width:0}
.rv-flag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--danger-soft);color:var(--danger)}
.rv-good{background:var(--good-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.rv-good b{color:var(--good)}
.rv-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rv-list label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:var(--surface-2);cursor:pointer;font-size:14.5px}
.rv-list input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.rv-list label.ck span.txt{text-decoration:line-through;color:var(--muted)}
.rv-crit-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.rv-fact{font-size:11px;font-weight:800;color:var(--danger);margin-right:4px}
.rv-ask{font-size:14.5px;border-left:3px solid var(--gold);padding:4px 0 4px 12px;color:var(--ink)}
.rv-ask b{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rv-progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rv-progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* ---------- Themes (picked with the Theme button; saved per device) ---------- */
html[data-skin="scholar"]{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#EBE7DF; --ink:#1E2332; --muted:#5D6170; --line:#D9D2C5;
  --accent:#7A2E3A; --accent-ink:#FFFFFF; --accent-soft:#F2E3E5;
  --gold:#A8844F; --gold-soft:#F3EADB; --danger:#B03A2E; --danger-soft:#F6E0DC; --good:#2F7A52; --good-soft:#E0EFE6;
  --s-social:#9C4A2A; --s-arts:#6B4A9E; --s-music:#A33E68; --s-math:#2D5A9E; --s-science:#2F7A52; --s-french:#9A7418; --s-home:#56657D; --s-event:#7D8699;
  --display:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --shadow:0 1px 2px rgba(30,35,50,.05),0 4px 14px rgba(30,35,50,.05);
}
html[data-skin="scholar"] .top h1,html[data-skin="scholar"] h2,html[data-skin="scholar"] h3{letter-spacing:-.01em}
html[data-skin="night"]{
  color-scheme:dark;
  --bg:#232B3D; --surface:#2D3750; --surface-2:#38435F; --ink:#EEF1F7; --muted:#B0B9CE; --line:#4A567A;
  --accent:#5CD0CF; --accent-ink:#0A2E30; --accent-soft:#2A5560;
  --gold:#F2B45A; --gold-soft:#4A3F2A; --danger:#FF8C70; --danger-soft:#553430; --good:#6BD89C; --good-soft:#284A3A;
  --s-social:#F29468; --s-arts:#BC95F2; --s-music:#F283B4; --s-math:#79A8FF; --s-science:#62D394; --s-french:#F0C75A; --s-home:#A5B7D4; --s-event:#9AA6C2;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.2);
}
html[data-skin="paper"]{
  --bg:#F4ECD9; --surface:#FFFAEE; --surface-2:#EFE4CD; --ink:#3A2E22; --muted:#7A6A55; --line:#E1D3B8;
  --accent:#8A5A2B; --accent-ink:#FFF8EA; --accent-soft:#F1E1C8;
  --gold:#BF8A3D; --gold-soft:#F5E6C8; --danger:#B0452D; --danger-soft:#F5DDD2; --good:#4E7B39; --good-soft:#E2ECD3;
  --s-social:#A8562F; --s-arts:#7A5594; --s-music:#A4486F; --s-math:#3F6699; --s-science:#4E7B39; --s-french:#A87D1E; --s-home:#6E6452; --s-event:#8D7F68;
  --display:"Lora", Georgia, "Times New Roman", serif;
  --shadow:0 1px 2px rgba(58,46,34,.06),0 4px 14px rgba(58,46,34,.06);
}
/* French trainer follows the theme too */
html[data-skin="scholar"] #trainerApp{--bg:#F3F1EC;--surface:#FFFFFF;--surface-2:#EBE7DF;--ink:#1E2332;--muted:#5D6170;--line:#D9D2C5;--bleu:#7A2E3A;--bleu-soft:#F2E3E5;--display:"Libre Baskerville",Georgia,serif}
html[data-skin="night"] #trainerApp{color-scheme:dark;--bg:#232B3D;--surface:#2D3750;--surface-2:#38435F;--ink:#EEF1F7;--muted:#B0B9CE;--line:#4A567A;--bleu:#93ACFF;--bleu-soft:#34406F;--rouge:#FF8C70;--rouge-soft:#553430;--vert:#6BD89C;--vert-soft:#284A3A;--or:#F2B45A;--or-soft:#4A3F2A}
html[data-skin="paper"] #trainerApp{--bg:#F4ECD9;--surface:#FFFAEE;--surface-2:#EFE4CD;--ink:#3A2E22;--muted:#7A6A55;--line:#E1D3B8;--bleu:#3F6699;--bleu-soft:#E3E8F0;--or-soft:#F5E6C8;--display:"Lora",Georgia,serif}
html[data-skin="night"] #trainerApp .result{background:#3A4670}
html[data-skin="night"] .news-item.k-event .news-ico{background:#34406F}
/* Theme picker */
.theme-wrap,.menu-wrap{position:relative}
a.theme-opt{text-decoration:none}
.theme-opt .pi{width:26px;text-align:center;font-size:1.1rem;flex:none}
#moreMenu{min-width:180px}
.theme-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow),0 12px 30px rgba(0,0,0,.18);padding:6px;display:grid;gap:4px;min-width:230px}
.theme-opt{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:8px 10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.theme-opt:hover{background:var(--surface-2)}
.theme-opt[aria-checked="true"]{background:var(--accent-soft);font-weight:700}
.theme-opt .sw{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.12);flex:none}
.theme-opt .sw i{width:12px;height:22px;display:block}
.theme-opt small{display:block;color:var(--muted);font-size:12px;font-weight:500}

/* ---------- What's new pop-up + side tab ---------- */
#newsModal{width:min(560px,calc(100vw - 32px))}
#newsModal .m-head{background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.news-sec{display:grid;gap:8px}
.news-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;cursor:pointer}
.news-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.news-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--surface-2);flex:none}
.news-item.k-announcement .news-ico{background:var(--gold-soft)}
.news-item.k-event .news-ico{background:#E6ECFB}
.news-item.k-assignment .news-ico,.news-item.k-material .news-ico{background:var(--accent-soft)}
.news-item.k-done .news-ico{background:var(--good-soft)}
.news-item .nt{font-weight:700;line-height:1.3}
.news-item .nd{font-size:13px;color:var(--muted);margin-top:2px}
.news-item .nw{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.news-new{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--danger);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.news-empty{color:var(--muted);font-size:14px;padding:6px 2px}
#newsTab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:40;border:0;border-radius:12px 0 0 12px;background:var(--ink);color:var(--bg);padding:14px 9px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;font:inherit}
#newsTab:hover{padding-right:13px}
#newsTab .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:13px;letter-spacing:.06em}
#newsTab .nb{min-width:22px;height:22px;border-radius:99px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
#newsTab .nb.zero{background:rgba(255,255,255,.25)}
@keyframes tabPulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 6px var(--accent-soft),0 6px 20px rgba(0,0,0,.25)}}
#newsTab.pulse{animation:tabPulse 1.2s ease 2}

/* ---------- Online sync pill ---------- */
.sync{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:99px;background:var(--surface-2);color:var(--muted);align-self:center;white-space:nowrap}
.sync[data-s="online"]{background:var(--good-soft);color:var(--good)}
.sync[data-s="saving"]{background:var(--gold-soft);color:var(--ink)}
.sync[data-s="error"],.sync[data-s="readonly"]{background:var(--danger-soft);color:var(--danger)}

/* ---------- Compact, fit-to-screen main page ----------
   On laptop/desktop screens the whole main page fits the window: the calendar
   stretches to fill what's left, and long lists scroll inside their own panel. */
#questApp .wrap{gap:12px}
body{padding-block:14px 14px}
.top h1{font-size:30px}
.top .label{font-size:10.5px}
.sub{margin-top:2px;font-size:13.5px}
.refreshed{margin-top:2px;font-size:12px}
.toolbar .btn,.toolbar .sync{padding:6px 11px;font-size:13px}
.stats-row{gap:8px}
.stats-row .stat{padding:7px 14px}
.stats-row .stat b{font-size:19px}
.stats-row .stat span{font-size:12.5px}
.next{gap:10px}
.ncard{padding:10px 14px;gap:4px;border-top-width:3px;box-shadow:none}
.ncard h3{font-size:15.5px}
.ncard .minibar{height:5px}
.ncard .when{font-size:12.5px}
.tabs{padding:3px}
.tab{padding:6px 14px;font-size:14px}
.quest-foot{display:none}
.panel{padding:12px}
.cal-head{margin-bottom:8px}
.cal-head h2{font-size:18px}
.day{min-height:70px;padding:4px;gap:2px}
.chip{font-size:11px;padding:2px 5px}
.side h3{font-size:15px;margin-bottom:8px}
.items{gap:6px}
.item{padding:7px 10px;gap:8px}
.item .t{font-size:14px}
.item .m{font-size:12px}
.legend{margin-top:8px;gap:8px;font-size:11px}
/* Deleted assignments */
.from-cr{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.btn.del{color:var(--danger)}
.delbox{padding:12px 14px;border-radius:12px;background:var(--danger-soft);font-size:14px}
.del-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.del-row .sw{width:8px;align-self:stretch;border-radius:4px;background:var(--c)}
.del-info{min-width:0}
.del-title{border:0;background:none;padding:0;font-weight:700;text-align:left;cursor:pointer;color:var(--ink)}
.del-title:hover{color:var(--accent);text-decoration:underline}
.del-row .m{font-size:12.5px;color:var(--muted)}
/* Header: date + refresh moved to the top right */
.top{align-items:center}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.top-meta{text-align:right;display:grid;gap:1px}
.top-meta .sub{margin:0;font-size:13px;font-weight:600;color:var(--ink)}
.top-meta .refreshed{margin:0;justify-content:flex-end;font-size:11.5px}
/* Up next: one slim row */
.upnext{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.upnext > .label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.12em}
.ncard{padding:7px 12px;gap:2px}
.ncard .nrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.ncard h3{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ncard .count{font-size:11px;padding:2px 7px}
.ncard .when{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:901px){ .cal-layout{grid-template-columns:minmax(0,1fr) 290px} }
@media (max-width:640px){ .top-right{justify-content:flex-start} .top-meta{text-align:left} .top-meta .refreshed{justify-content:flex-start} }
.stats-row .stat{padding:6px 14px}
@media (min-width:901px) and (min-height:620px){
  #questApp .wrap{height:calc(100vh - 28px);grid-template-rows:auto auto auto auto minmax(0,1fr);min-height:0}
  #view-calendar{min-height:0;height:100%;grid-template-rows:minmax(0,1fr);align-items:stretch}
  #view-calendar > .panel,#view-calendar > .side{height:100%;min-height:0}
  #view-calendar > .panel{display:flex;flex-direction:column}
  #calGrid{flex:1;min-height:0;grid-template-rows:auto;grid-auto-rows:minmax(0,1fr)}
  #calGrid .day{min-height:0;overflow:hidden}
  #view-calendar > .side{min-height:0;overflow:auto}
  #view-list{min-height:0;overflow:auto}
  #view-materials{min-height:0;overflow:auto}
}
@media (min-width:901px) and (max-height:760px){
  #calGrid .day .chip,#calGrid .day .more{display:none}
  #calGrid .day .dots{display:flex}
}

/* ---------- Materials tab (reference material from Classroom) ---------- */
.mat-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.mat-bar label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.mat-bar select{font:inherit;font-size:14px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.mat-count{font-size:12.5px;color:var(--muted);margin-left:auto}
.mat-table{width:100%;border-collapse:collapse;font-size:14px}
.mat-table th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;padding:0;border-bottom:1px solid var(--line)}
.mat-table th button{border:0;background:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:8px 10px;font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mat-table th button:hover,.mat-table th[aria-sort] button{color:var(--ink)}
.mat-table th .arr{font-size:9px}
.mat-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.mat-table tbody tr:hover td{background:color-mix(in srgb,var(--c) 6%,transparent)}
.mat-table td.mat-posted{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--muted)}
.mat-title{font-weight:700;color:var(--ink);text-decoration:none}
.mat-title:hover{color:var(--accent);text-decoration:underline}
.mat-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mat-file{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink);text-decoration:none;background:var(--surface)}
.mat-file:hover{border-color:var(--accent);background:var(--accent-soft)}
.mat-file .kind{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:5px;background:var(--surface-2);color:var(--muted);flex:none}
.mat-file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-subj{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.mat-subj i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.mat-teacher{font-size:12px;color:var(--muted)}
.mat-for{display:grid;gap:3px;justify-items:start}
.mat-link{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;color:var(--accent);text-align:left}
.mat-link:hover{text-decoration:underline}
.mat-due{font-size:12.5px;color:var(--muted)}
.mat-none{color:var(--muted)}
@media (max-width:700px){
  .mat-table thead{display:block;border-bottom:1px solid var(--line)}
  .mat-table thead tr{display:flex;flex-wrap:wrap;gap:2px}
  .mat-table thead th{position:static;border:0}
  .mat-table tbody,.mat-table tbody tr,.mat-table tbody td{display:block}
  .mat-table tbody tr{padding:10px 0;border-bottom:1px solid var(--line)}
  .mat-table tbody td{border:0;padding:2px 0}
  .mat-table td.mat-posted::before{content:"Posted "}
  .mat-table tbody td:nth-child(3){display:flex;gap:8px;align-items:baseline;margin-top:4px}
}

/* ================= FRENCH TRAINER (scoped) ================= */
#trainerApp{
  color-scheme: light;
  --bg:#F3F5FB; --surface:#FFFFFF; --surface-2:#E9EDF7; --ink:#17203B; --muted:#5A6583; --line:#D4DBEA;
  --bleu:#2447C7; --bleu-soft:#DEE5FB; --rouge:#D6452A; --rouge-soft:#FBE2DC; --vert:#23945A; --vert-soft:#DCF2E5; --or:#D99A1E; --or-soft:#FBEFD5;
  --shadow:0 1px 2px rgba(23,32,59,.06),0 6px 20px rgba(23,32,59,.07);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
#trainerApp *{box-sizing:border-box}
#trainerApp{margin:0}
#trainerApp{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);}
#trainerApp [hidden]{display:none!important}
#trainerApp .wrap{max-width:900px;margin:0 auto;display:grid;gap:18px}
#trainerApp h1,#trainerApp h2,#trainerApp h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
#trainerApp button{font:inherit;color:inherit;cursor:pointer}
#trainerApp button:focus-visible,#trainerApp a:focus-visible,#trainerApp input:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
#trainerApp a{color:var(--bleu)}
#trainerApp .label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#trainerApp .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#trainerApp .back{font-weight:600;text-decoration:none;font-size:14px}
#trainerApp .hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
#trainerApp .hero h1{font-size:clamp(26px,4.4vw,40px);font-weight:800;letter-spacing:-.02em}
#trainerApp .hero h1 em{font-style:normal;color:var(--bleu)}
#trainerApp .flag{display:inline-flex;height:6px;width:54px;border-radius:3px;overflow:hidden;margin-bottom:10px}
#trainerApp .flag i{flex:1}
#trainerApp .meter{display:flex;gap:14px}
#trainerApp .ring{--p:0;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--bleu) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
#trainerApp .ring span{width:60px;height:60px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px}
#trainerApp .meter .txt{display:grid;align-content:center;font-size:13px;color:var(--muted)}
#trainerApp .meter .txt b{font-family:var(--display);font-size:20px;color:var(--ink)}
#trainerApp .tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto}
#trainerApp .tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:15px}
#trainerApp .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#trainerApp .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
#trainerApp .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:15px}
#trainerApp .btn:hover{border-color:var(--bleu)}
#trainerApp .btn.primary{background:var(--bleu);border-color:var(--bleu);color:#fff}
#trainerApp .btn.good{background:var(--vert);border-color:var(--vert);color:#fff}
#trainerApp .btn.bad{background:var(--rouge-soft);border-color:var(--rouge);color:var(--rouge)}
#trainerApp .btn.small{padding:5px 10px;font-size:13px}
#trainerApp .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#trainerApp .stack{display:grid;gap:14px}
#trainerApp .muted{color:var(--muted)}
#trainerApp .speak{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;font-size:15px;flex:none}
#trainerApp .speak:hover{border-color:var(--bleu);background:var(--bleu-soft)}
#trainerApp .plan{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
#trainerApp .plan li{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;counter-increment:s}
#trainerApp .plan li::before{content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--mono);font-weight:700;font-size:14px}
#trainerApp .plan li.ok::before{content:"✓";background:var(--vert);color:#fff}
#trainerApp .plan li.now{border-color:var(--bleu);background:var(--bleu-soft)}
#trainerApp .plan .t{font-weight:700}
#trainerApp .plan .d{font-size:13.5px;color:var(--muted)}
#trainerApp .tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
#trainerApp .tip{background:var(--surface-2);border-radius:12px;padding:12px 14px}
#trainerApp .tip b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
#trainerApp .tip p{margin:0;font-size:13.5px;color:var(--muted)}
#trainerApp .countdown{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--or-soft);border-radius:12px;padding:12px 14px}
#trainerApp .countdown input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
#trainerApp .sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#trainerApp .setcard{border:1px solid var(--line);border-radius:12px;padding:12px}
#trainerApp .setcard .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
#trainerApp .setcard .bar i{display:block;height:100%;background:var(--bleu)}
#trainerApp .fc-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
#trainerApp .seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
#trainerApp .seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
#trainerApp .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#trainerApp .card{perspective:1200px;height:260px;margin-top:16px}
#trainerApp .card-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
#trainerApp .card.flip .card-in{transform:rotateY(180deg)}
#trainerApp .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;text-align:center;padding:24px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
#trainerApp .face.front{background:linear-gradient(180deg,var(--surface),var(--bleu-soft))}
#trainerApp .face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--surface),var(--or-soft))}
#trainerApp .face .big{font-family:var(--display);font-size:clamp(30px,6vw,48px);font-weight:800}
#trainerApp .face .hook{font-size:15px;color:var(--muted);max-width:44ch;margin-top:8px}
#trainerApp .face .hint{font-size:13px;color:var(--muted);margin-top:10px}
#trainerApp .boxes{display:inline-flex;gap:3px}
#trainerApp .boxes i{width:10px;height:10px;border-radius:3px;background:var(--surface-2)}
#trainerApp .boxes i.on{background:var(--bleu)}
#trainerApp .q{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;background:var(--surface)}
#trainerApp .q .num{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:700}
#trainerApp .q .prompt{font-size:18px;font-weight:600}
#trainerApp .q .prompt .fr{font-family:var(--display);font-size:22px;color:var(--bleu)}
#trainerApp .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
#trainerApp .opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-weight:600}
#trainerApp .opt:hover{border-color:var(--bleu)}
#trainerApp .opt[aria-pressed="true"]{border-color:var(--bleu);background:var(--bleu-soft)}
#trainerApp .opt.right{border-color:var(--vert);background:var(--vert-soft)}
#trainerApp .opt.wrong{border-color:var(--rouge);background:var(--rouge-soft)}
#trainerApp .q input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;max-width:360px;background:var(--surface);color:var(--ink)}
#trainerApp .q.right{border-color:var(--vert)}
#trainerApp .q.wrong{border-color:var(--rouge)}
#trainerApp .fb{font-size:14.5px;padding:10px 12px;border-radius:10px}
#trainerApp .fb.right{background:var(--vert-soft)}

#fracApp .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* quiz */

#fracApp .score{font-family:var(--mono);font-size:.86rem}
#fracApp .streak{background:var(--gold);color:#1B1B1B;padding:1px 6px;border-radius:4px;font-weight:700}

#fracApp .prompt{font-size:1.15rem;line-height:1.6;min-width:0}
#fracApp .big{display:block;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:1.45rem;overflow-wrap:anywhere}
#fracApp .rad{white-space:nowrap}
#fracApp .ov{border-top:2px solid currentColor;padding:0 2px}

#fracApp .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
#fracApp .choice{appearance:none;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;font-size:1.02rem;text-align:left;min-height:50px}

#fracApp .ansrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

#fracApp .nb:focus-within{border-color:var(--fr-accent);box-shadow:0 0 0 3px var(--fr-soft)}
#fracApp .pm{appearance:none;border:0;border-right:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);width:42px;font-family:var(--mono);font-size:1.15rem;cursor:pointer}
#fracApp .num{border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:1.2rem;font-weight:700;padding:10px 12px;width:12ch;min-width:0;outline:none}

#fracApp .num.exp{width:5ch}
#fracApp .sciin{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap;font-family:var(--mono);font-size:1.2rem;font-weight:700}

#fracApp .foot{text-align:left}

#fracApp .unit{font-family:var(--mono);color:var(--muted)}

#fracApp .tray.ans{border-color:var(--fr-accent);background:var(--fr-soft)}
#fracApp .chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-family:var(--mono);font-weight:700;cursor:pointer}
#fracApp .chip:hover:not(:disabled){border-color:var(--fr-accent)}
#fracApp .chip .ix{font-size:.7rem;color:var(--muted);margin-right:4px}
#fracApp .lt{align-self:center;color:var(--muted);font-family:var(--mono)}
#fracApp .hint{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:.97rem}
#fracApp .msg{color:var(--danger);font-size:.92rem;min-height:1.2em;margin:0}
#fracApp .fb{border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}

#fracApp .fb.ok{background:var(--good-soft)}
#fracApp .fb.no{background:var(--danger-soft)}
#fracApp .fbh{font-size:1.2rem;font-weight:800}
#fracApp .fb.ok .fbh{color:var(--good)} #fracApp .fb.no .fbh{color:var(--danger)}
#fracApp .watch{background:var(--gold-soft);border-radius:8px;padding:8px 12px}
#fracApp ol.steps{margin:0;padding:0 0 0 22px;display:grid;gap:6px}
#fracApp details summary{cursor:pointer;font-weight:700}
#fracApp details[open] summary{margin-bottom:8px}

#fracApp mark{background:var(--gold);color:#1B1B1B;padding:0 3px;border-radius:3px}
#fracApp .xpf{font-family:var(--mono);font-weight:700;color:var(--fr-accent)}
/* results */

#fracApp .bigscore{font-family:var(--display);font-weight:800;font-size:clamp(3rem,13vw,4.6rem);line-height:1}
#fracApp .bkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
#fracApp .bkrow span:last-child{font-family:var(--mono)}
#fracApp .rv{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
#fracApp .rv.no{border-color:var(--danger)}
#fracApp .rv .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#fracApp .rv .qn{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:700}
#fracApp .timer{font-family:var(--mono);font-size:.86rem;color:var(--muted)}
#fracApp .lock{font-size:.78rem;color:var(--muted)}
@media (max-width:560px){#fracApp{font-size:16px}#fracApp .stats{grid-template-columns:repeat(2,minmax(0,1fr))}#fracApp .steps3{grid-template-columns:1fr}#fracApp .warm{grid-template-columns:auto minmax(0,1fr)}#fracApp .warm .btn{grid-column:1/-1}#fracApp .qcard{padding:16px}}

/* ---------- calmer navigation: compact top bar, tabs, rows, collapsible refreshers, pinned actions ---------- */
#fracApp .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 6px}

#fracApp .row-btn,#fracApp .lrow{appearance:none;width:100%;text-align:left;font:inherit;color:inherit;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
#fracApp .row-btn:hover,#fracApp .lrow:hover:not(:disabled){border-color:var(--fr-accent)}
#fracApp .row-btn small,#fracApp .lrow small{display:block;color:var(--muted);font-size:.82rem;font-weight:500}

#fracApp .path>div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
#fracApp .path b{font-family:var(--mono);font-size:1.15rem}
#fracApp .path span{font-size:.78rem;color:var(--muted);font-weight:600}
#fracApp .list{display:grid;gap:8px}

#fracApp .lrow:disabled{opacity:.55;cursor:default}

#fracApp .lname b{font-family:var(--display);font-size:1rem;line-height:1.25}

#fracApp .dot.on{background:var(--good);border-color:var(--good)}
#fracApp .stepline{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
#fracApp .stepline span{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
#fracApp .stepline span.ok{background:var(--good-soft);color:var(--good)}
#fracApp details.acc{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}

/* ================= MATH MASTERY TRAINER (Ch 1–2; scoped; follows the Quest Log theme) ================= */
#mathApp{
  --mt-accent:var(--s-math); --mt-accent-ink:#FFFFFF; --mt-soft:color-mix(in srgb,var(--s-math) 12%,var(--surface));
  background:var(--bg); color:var(--ink); font:17px/1.55 var(--body);
  margin-inline:-16px; padding-inline:16px; padding-block:6px 56px; min-height:100vh;
}
html[data-skin="night"] #mathApp{--mt-accent-ink:#0B1530}
#mathApp .mt-wrap{max-width:820px;margin:0 auto}
#mathApp h1,#mathApp h2,#mathApp h3,#mathApp .fbh{font-family:var(--display);text-wrap:balance;margin:0}
#mathApp :focus-visible{outline:3px solid var(--mt-accent);outline-offset:2px;border-radius:6px}

#mathApp .scard:hover{border-color:var(--mt-accent)}
#mathApp .scard.done{border-color:var(--good);box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 25%,transparent)}
#mathApp .scard .top{display:flex;gap:10px;align-items:center}
#mathApp .scard .badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--mt-soft);color:var(--mt-accent);flex:none}
#mathApp .scard.done .badge{background:var(--good);color:#fff}
#mathApp .scard .nm{font-family:var(--display);font-weight:800;font-size:1.02rem;line-height:1.2}
#mathApp .scard .ls{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
#mathApp .pips{display:flex;gap:6px;flex-wrap:wrap}
#mathApp .pip{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
#mathApp .pip.on{background:var(--good-soft);color:var(--good)}
#mathApp .meter{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
#mathApp .meter i{display:block;height:100%;background:var(--mt-accent)}
/* exams */
#mathApp .exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
#mathApp .ecard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer;appearance:none}
#mathApp .ecard:hover:not(:disabled){border-color:var(--mt-accent)}
#mathApp .ecard:disabled{opacity:.55;cursor:default}
#mathApp .ecard.final{grid-column:1/-1;background:linear-gradient(135deg,var(--gold-soft),var(--surface));border-color:var(--gold)}
#mathApp .ecard b{font-family:var(--display);font-size:1.05rem}
#mathApp .ecard small{color:var(--muted);font-size:.8rem}
#mathApp .ecard .sc{font-family:var(--mono);font-size:.82rem}
#mathApp .ecard .sc.pass{color:var(--good);font-weight:700}
#mathApp .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#mathApp .bdg{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;background:var(--surface);font-size:.85rem}
#mathApp .bdg.off{opacity:.45}
#mathApp .bdg .e{font-size:1.5rem}
#mathApp .bdg b{font-size:.92rem}
#mathApp .foot{color:var(--muted);font-size:.85rem;margin-top:16px}
/* section page + refresher */
#mathApp .steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
#mathApp .step{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
#mathApp .step.ok{border-color:var(--good)}
#mathApp .step .n{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-weight:700}
#mathApp .step b{font-family:var(--display)}
#mathApp .card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
#mathApp .ideas{margin:0;padding:0;list-style:none;display:grid;gap:8px}
#mathApp .ideas li{border-left:4px solid var(--mt-accent);background:var(--mt-soft);border-radius:0 10px 10px 0;padding:8px 12px}
#mathApp .ideas li.warn{border-left-color:var(--gold);background:var(--gold-soft)}
#mathApp .ex{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:.97rem}
#mathApp .ex .t{font-weight:700}
#mathApp .ex code,#mathApp .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#mathApp .flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
#mathApp .flip{appearance:none;font:inherit;color:inherit;text-align:left;border:1.5px dashed var(--mt-accent);background:var(--surface);border-radius:12px;padding:12px;min-height:84px;cursor:pointer;display:grid;gap:6px;align-content:start}
#mathApp .flip .q{font-weight:700}
#mathApp .flip .a{display:none;color:var(--good);font-weight:700}
#mathApp .flip.open{border-style:solid;border-color:var(--good);background:var(--good-soft)}
#mathApp .flip.open .a{display:block}
#mathApp .flip .tap{font-size:.78rem;color:var(--muted)}
#mathApp .flip.open .tap{display:none}
#mathApp table.pfx{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
#mathApp table.pfx td,#mathApp table.pfx th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
#mathApp table.pfx th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#mathApp table.pfx tr.hi td{background:var(--gold-soft);font-weight:700}
#mathApp .tbl{overflow-x:auto}
/* quiz */
#mathApp .qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#mathApp .prog{flex:1;min-width:160px;display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-family:var(--mono)}
#mathApp .pbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
#mathApp .pbar i{display:block;height:100%;background:var(--mt-accent);transition:width .3s}
#mathApp .score{font-family:var(--mono);font-size:.86rem}
#mathApp .streak{background:var(--gold);color:#1B1B1B;padding:1px 6px;border-radius:4px;font-weight:700}
#mathApp .qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:grid;gap:14px;min-width:0}
#mathApp .qcard .tag{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--gold-soft);color:var(--ink);margin-left:6px}
#mathApp .prompt{font-size:1.15rem;line-height:1.6;min-width:0}
#mathApp .big{display:block;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:1.45rem;overflow-wrap:anywhere}
#mathApp .rad{white-space:nowrap}
#mathApp .ov{border-top:2px solid currentColor;padding:0 2px}
#mathApp sup{font-size:.72em}
#mathApp .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
#mathApp .choice{appearance:none;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;font-size:1.02rem;text-align:left;min-height:50px}
#mathApp .choice.sym{text-align:center;font-family:var(--mono);font-size:1.5rem;font-weight:700}
#mathApp .choice:hover:not(:disabled){border-color:var(--mt-accent);background:var(--mt-soft)}
#mathApp .choice.sel{border-color:var(--mt-accent);background:var(--mt-soft)}
#mathApp .choice.picked-ok{border-color:var(--good);background:var(--good-soft)}
#mathApp .choice.picked-no{border-color:var(--danger);background:var(--danger-soft)}
#mathApp .choice.right{border-color:var(--good);border-width:2.5px}
#mathApp .choice:disabled{cursor:default}
#mathApp .ansrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#mathApp .nb{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
#mathApp .nb:focus-within{border-color:var(--mt-accent);box-shadow:0 0 0 3px var(--mt-soft)}
#mathApp .pm{appearance:none;border:0;border-right:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);width:42px;font-family:var(--mono);font-size:1.15rem;cursor:pointer}
#mathApp .num{border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:1.2rem;font-weight:700;padding:10px 12px;width:12ch;min-width:0;outline:none}
#mathApp .num.wide{width:18ch}
#mathApp .num.exp{width:5ch}
#mathApp .sciin{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap;font-family:var(--mono);font-size:1.2rem;font-weight:700}
#mathApp .num.coef{width:8ch}
#mathApp .foot{text-align:left}
#mathApp .sciin .ten{display:inline-flex;align-items:flex-start;gap:2px}
#mathApp .sciin .ten .nb{transform:translateY(-10px)}
#mathApp .unit{font-family:var(--mono);color:var(--muted)}
#mathApp .tray{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;padding:8px;border:1.5px dashed var(--line);border-radius:12px}
#mathApp .tray.ans{border-color:var(--mt-accent);background:var(--mt-soft)}
#mathApp .chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-family:var(--mono);font-weight:700;cursor:pointer}
#mathApp .chip:hover:not(:disabled){border-color:var(--mt-accent)}
#mathApp .chip .ix{font-size:.7rem;color:var(--muted);margin-right:4px}
#mathApp .lt{align-self:center;color:var(--muted);font-family:var(--mono)}
#mathApp .hint{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:.97rem}
#mathApp .msg{color:var(--danger);font-size:.92rem;min-height:1.2em;margin:0}
#mathApp .fb{border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
#mathApp .fb p{margin:0}
#mathApp .fb.ok{background:var(--good-soft)}
#mathApp .fb.no{background:var(--danger-soft)}
#mathApp .fbh{font-size:1.2rem;font-weight:800}
#mathApp .fb.ok .fbh{color:var(--good)} #mathApp .fb.no .fbh{color:var(--danger)}
#mathApp .watch{background:var(--gold-soft);border-radius:8px;padding:8px 12px}
#mathApp ol.steps{margin:0;padding:0 0 0 22px;display:grid;gap:6px}
#mathApp details summary{cursor:pointer;font-weight:700}
#mathApp details[open] summary{margin-bottom:8px}
#mathApp .added{font-size:.9rem;color:var(--muted);font-style:italic}
#mathApp mark{background:var(--gold);color:#1B1B1B;padding:0 3px;border-radius:3px}
#mathApp .xpf{font-family:var(--mono);font-weight:700;color:var(--mt-accent)}
/* results */
#mathApp .end{display:grid;gap:14px}
#mathApp .bigscore{font-family:var(--display);font-weight:800;font-size:clamp(3rem,13vw,4.6rem);line-height:1}
#mathApp .bkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
#mathApp .bkrow span:last-child{font-family:var(--mono)}
#mathApp .rv{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
#mathApp .rv.no{border-color:var(--danger)}
#mathApp .rv .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#mathApp .rv .qn{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:700}
#mathApp .timer{font-family:var(--mono);font-size:.86rem;color:var(--muted)}
#mathApp .lock{font-size:.78rem;color:var(--muted)}
@media (max-width:560px){#mathApp{font-size:16px}#mathApp .stats{grid-template-columns:repeat(2,minmax(0,1fr))}#mathApp .steps3{grid-template-columns:1fr}#mathApp .warm{grid-template-columns:auto minmax(0,1fr)}#mathApp .warm .btn{grid-column:1/-1}#mathApp .qcard{padding:16px}}
@media (prefers-reduced-motion:no-preference){#mathApp .fb{animation:mtRise .25s ease-out}@keyframes mtRise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
/* ---------- calmer navigation: compact top bar, tabs, rows, collapsible refreshers, pinned actions ---------- */
#mathApp .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 6px}
#mathApp .topbar .mt-back{margin:0}
#mathApp .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#mathApp .chipx{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
#mathApp .chipx.warn{background:var(--gold-soft);border-color:var(--gold)}
#mathApp .mt-title{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0 0}
#mathApp .mt-title.sm{font-size:clamp(1.35rem,4.2vw,1.8rem)}
#mathApp .sub1{margin:4px 0 12px;color:var(--muted);font-size:.92rem}
#mathApp .muted{margin:0 0 8px;color:var(--muted);font-size:.9rem}
#mathApp .mtabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
#mathApp .mtab{flex:1;appearance:none;border:0;background:transparent;font:inherit;font-weight:700;font-size:.92rem;color:var(--muted);padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
#mathApp .mtab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#mathApp .tabbody{display:grid;gap:10px}
#mathApp .next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--mt-accent);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
#mathApp .next .ico{font-size:2rem}
#mathApp .next h2{font-size:1.15rem;margin-top:2px}
#mathApp .next p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
#mathApp .row-btn,#mathApp .lrow{appearance:none;width:100%;text-align:left;font:inherit;color:inherit;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
#mathApp .row-btn:hover,#mathApp .lrow:hover:not(:disabled){border-color:var(--mt-accent)}
#mathApp .row-btn small,#mathApp .lrow small{display:block;color:var(--muted);font-size:.82rem;font-weight:500}
#mathApp .row-btn>span:first-child{font-size:1.4rem}
#mathApp .chev{color:var(--muted);font-size:1.3rem;line-height:1}
#mathApp .path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#mathApp .path>div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
#mathApp .path b{font-family:var(--mono);font-size:1.15rem}
#mathApp .path span{font-size:.78rem;color:var(--muted);font-weight:600}
#mathApp .list{display:grid;gap:8px}
#mathApp .lrow{grid-template-columns:auto minmax(0,1fr) auto auto}
#mathApp .lrow:disabled{opacity:.55;cursor:default}
#mathApp .lrow.done{border-color:var(--good)}
#mathApp .lrow.final{background:linear-gradient(135deg,var(--gold-soft),var(--surface));border-color:var(--gold)}
#mathApp .lno{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.9rem;background:var(--mt-soft);color:var(--mt-accent)}
#mathApp .lrow.done .lno{background:var(--good);color:#fff}
#mathApp .lname b{font-family:var(--display);font-size:1rem;line-height:1.25}
#mathApp .dots{display:flex;gap:4px}
#mathApp .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.62rem;font-weight:800;color:#fff}
#mathApp .dot.on{background:var(--good);border-color:var(--good)}
#mathApp .stepline{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
#mathApp .stepline span{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
#mathApp .stepline span.ok{background:var(--good-soft);color:var(--good)}
#mathApp details.acc{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
#mathApp details.acc>summary{font-family:var(--display);font-weight:800;font-size:1.02rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
#mathApp details.acc>summary::-webkit-details-marker{display:none}
#mathApp details.acc>summary::after{content:"＋";color:var(--muted);font-weight:700}
#mathApp details.acc[open]>summary::after{content:"−"}
#mathApp details.acc[open]>summary{margin-bottom:10px}
#mathApp details.acc .ex{margin-bottom:8px}
#mathApp .dock{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:6px;background:linear-gradient(to top,var(--bg) 75%,transparent)}
#mathApp .dock .btn{flex:1;min-width:140px}
#mathApp .qcard #mt-actions{position:sticky;bottom:0;z-index:3;background:var(--surface);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-block:-8px}
#mathApp .multi{display:flex;flex-wrap:wrap;gap:8px}
#mathApp .mchip{appearance:none;font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 16px;cursor:pointer}
#mathApp .mchip[aria-pressed="true"]{background:var(--mt-accent);border-color:var(--mt-accent);color:var(--mt-accent-ink)}
#mathApp .mchip[aria-pressed="true"]::before{content:"✓ "}
#mathApp .mchip:disabled{cursor:default}
@media (max-width:560px){#mathApp .next{grid-template-columns:auto minmax(0,1fr)}#mathApp .next .btn{grid-column:1/-1}#mathApp .path{grid-template-columns:repeat(3,minmax(0,1fr))}#mathApp .path span{font-size:.7rem}#mathApp .dots{display:none}}


/* ================= VOICE TRAINER (Active & Passive Voice; scoped; follows the Quest Log theme) ================= */
:root{--s-lang:#5145CD}
html[data-skin="scholar"]{--s-lang:#4B4A8F}
html[data-skin="night"]{--s-lang:#A9A6FF}
html[data-skin="paper"]{--s-lang:#5B5A9A}
#voiceApp{
  --vt-accent:var(--s-lang); --vt-accent-ink:#FFFFFF; --vt-accent-soft:color-mix(in srgb,var(--s-lang) 12%,var(--surface));
  background:var(--bg); color:var(--ink); font:17px/1.55 var(--body);
  margin-inline:-16px; padding-inline:16px; padding-block:6px 48px; min-height:100vh;
}
html[data-skin="night"] #voiceApp{--vt-accent-ink:#17143F}
#voiceApp .vt-wrap{max-width:760px;margin:0 auto}
#voiceApp h1,#voiceApp h2,#voiceApp .fbh{font-family:var(--display);text-wrap:balance;margin:0}
#voiceApp :focus-visible{outline:3px solid var(--vt-accent);outline-offset:2px;border-radius:6px}
#voiceApp .eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
#voiceApp .vt-back{font-weight:600;text-decoration:none;font-size:14px;color:var(--vt-accent);display:inline-block;margin-bottom:6px}
#voiceApp .hero{display:grid;gap:12px;padding-block:8px 18px}
#voiceApp .hero h1{font-size:clamp(2rem,6.5vw,3rem);font-weight:800;line-height:1.04;letter-spacing:-.02em}
#voiceApp .hl{background:linear-gradient(transparent 58%,var(--gold) 58%,var(--gold) 92%,transparent 92%);padding-inline:.06em}
#voiceApp .lede{margin:0;max-width:62ch;color:var(--muted)}
#voiceApp .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
#voiceApp .expert-count{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin:0}
#voiceApp .btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;min-height:46px}
#voiceApp .btn:hover{border-color:var(--vt-accent)}
#voiceApp .btn.primary{background:var(--vt-accent);border-color:var(--vt-accent);color:var(--vt-accent-ink)}
#voiceApp .btn.primary:hover{filter:brightness(1.07)}
#voiceApp .btn.ghost{background:transparent}
#voiceApp .btn:disabled{opacity:.45;cursor:default}
#voiceApp .vt-link{appearance:none;background:none;border:0;color:var(--vt-accent);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
#voiceApp .notes{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-block:4px 14px}
#voiceApp .notes summary{cursor:pointer;font-weight:700}
#voiceApp .notes ul{margin:10px 0 4px;padding-left:20px;display:grid;gap:6px}
#voiceApp .notes .good{color:var(--good);font-weight:700}
#voiceApp .notes p{margin:8px 0 0}
#voiceApp .rules{display:grid;gap:10px;margin-top:10px}
#voiceApp .rule{border-left:4px solid var(--vt-accent);background:var(--vt-accent-soft);border-radius:0 10px 10px 0;padding:8px 12px}
#voiceApp .rule.warn{border-left-color:var(--gold);background:var(--gold-soft)}
#voiceApp .rule b{font-family:var(--display)}
#voiceApp .tbl{overflow-x:auto}
#voiceApp table.tense{border-collapse:collapse;width:100%;font-size:.92rem;min-width:420px}
#voiceApp table.tense th,#voiceApp table.tense td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
#voiceApp table.tense th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#voiceApp table.tense td:last-child{font-weight:700}
#voiceApp .sec{font-size:1.3rem;font-weight:800;margin:18px 0 10px}
#voiceApp .levels{display:grid;gap:8px}
#voiceApp .lvl{appearance:none;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;cursor:pointer;font:inherit}
#voiceApp .lvl:hover{border-color:var(--vt-accent)}
#voiceApp .lvl.next{border-color:var(--vt-accent);box-shadow:0 0 0 3px var(--vt-accent-soft)}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date(); d.setHours(0,0,0,0); return d;};
const daysUntil=s=>Math.round((pd(s)-today())/86400000);
const fmt=(s,opt={weekday:'short',month:'short',day:'numeric'})=>pd(s).toLocaleDateString('en-CA',opt);
const col=sub=>'var('+(SUBJECTS[sub]||SUBJECTS.home).c+')';

// Deleting is a soft delete: the task is hidden but its progress is kept, so it can be restored.
function allTasks(){
  store.deleted=store.deleted||{};
  return [...BUILT_IN, ...store.custom].map(t=>({...t, due: store.dueOverride[t.id] ?? t.due}));
}
// Only assignments added on this page can be deleted; anything from Google Classroom always stays.
const isDeleted=t=>!!(t.custom&&store.deleted&&store.deleted[t.id]);
function deletedTasks(){ return allTasks().filter(isDeleted).sort((a,b)=>(store.deleted[b.id]||'').localeCompare(store.deleted[a.id]||'')); }
function tasks(){
  return allTasks().filter(t=>!isDeleted(t));
}
const st=id=>store.state[id]||(store.state[id]={});
const isDone=t=>!!(t.turnedIn || (store.state[t.id]&&store.state[t.id].done));
const isLate=t=>!isDone(t)&&t.due&&daysUntil(t.due)<0;

function countdown(t){
  if(isDone(t)) return {txt:'Done ✓', cls:'ok'};
  if(!t.due) return {txt:'Anytime', cls:''};
  const n=daysUntil(t.due);
  if(n<0) return {txt:Math.abs(n)+'d late', cls:'hot'};
  if(n===0) return {txt:'Due today', cls:'hot'};
  if(n===1) return {txt:'Tomorrow', cls:'hot'};
  if(n<=7) return {txt:n+' days', cls:'soon'};
  return {txt:n+' days', cls:''};
}

  const steps=t.steps||[]; const ck=(st(t.id).steps||[]).filter(Boolean).length;
  return s+(steps.length?Math.floor(ck*5):0);
},0); }

function badges(){
  const all=tasks(), done=all.filter(isDone);
  const sketches=done.filter(t=>t.id.startsWith('sketch')).length;
  const early=done.filter(t=>st(t.id).early).length;
  const classroom=done.filter(t=>st(t.id).how==='classroom').length;
  const subjects=new Set(done.map(t=>t.subject));
  return [
    {k:'1', name:'First Win', d:'Finish your first assignment.', on:done.length>=1},
    {k:'M', name:'Master Mapper', d:'Complete the Colonization Assignment.', on:done.some(t=>t.id==='colonization')},

    {k:'C', name:'Cloud Submitter', d:'Turn in 3 things on Google Classroom.', on:classroom>=3},
    {k:'5', name:'On a Roll', d:'Finish 5 assignments.', on:done.length>=5},
    {k:'S', name:'All-Rounder', d:'Finish work in 4 different subjects.', on:subjects.size>=4},
    {k:'0', name:'Clean Slate', d:'Have zero overdue work (and at least 1 done).', on:done.length>0&&!all.some(isLate)}
  ];
}

function itemButton(t, isEvent){
  const b=document.createElement('button');

  b.style.setProperty('--c', isEvent?col('event'):col(t.subject));

  if(isEvent){ meta=(t.time||'')+' · '+fmt(t.date); right='<span class="count">Event</span>'; }
  else { const c=countdown(t); meta=(SUBJECTS[t.subject]||SUBJECTS.home).name+(t.due?' · '+fmt(t.due):''); right='<span class="count '+c.cls+'">'+esc(c.txt)+'</span>'; }

}

function renderCalendar(){
  $('#monthTitle').textContent=cursor.toLocaleDateString('en-CA',{month:'long',year:'numeric'});
  const g=$('#calGrid'); g.innerHTML='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{const e=document.createElement('div'); e.className='dow'; e.textContent=d; g.appendChild(e);});
  const start=new Date(cursor); start.setDate(1-cursor.getDay());
  const all=tasks(), tkey=ymd(today());
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    if(i===35 && d.getMonth()!==cursor.getMonth()) break;
    const key=ymd(d);
    const dayTasks=all.filter(t=>t.due===key), dayEv=EVENTS.filter(e=>e.date===key);
    const cell=document.createElement('button'); cell.type='button';
    cell.className='day'+(d.getMonth()!==cursor.getMonth()?' out':'')+(key===tkey?' today':'')+(key===selected?' sel':'');
    cell.setAttribute('aria-label', d.toDateString()+', '+(dayTasks.length+dayEv.length)+' items');
    let html='<span class="num">'+d.getDate()+'</span>';
    const entries=[...dayTasks.map(t=>({t,ev:false})), ...dayEv.map(t=>({t,ev:true}))];
    entries.slice(0,3).forEach(({t,ev})=>{
      const cls='chip'+(ev?' event':'')+(!ev&&isDone(t)?' done':'')+(!ev&&isLate(t)?' late':'');
      html+='<span class="'+cls+'" style="--c:'+(ev?col('event'):col(t.subject))+'">'+esc(t.title)+'</span>';
    });
    if(entries.length>3) html+='<span class="more">+'+(entries.length-3)+' more</span>';
    if(entries.length) html+='<span class="dots">'+entries.map(({t,ev})=>'<i style="--c:'+(ev?col('event'):(isLate(t)?'var(--danger)':col(t.subject)))+'"></i>').join('')+'</span>';
    cell.innerHTML=html;
    cell.onclick=()=>{selected=key; renderCalendar(); renderDay();};
    g.appendChild(cell);
  }
  $('#legend').innerHTML=Object.values(SUBJECTS).map(s=>'<span><i style="--c:var('+s.c+')"></i>'+s.name+'</span>').join('');
}

function renderDay(){
  const d=pd(selected);
  $('#dayTitle').textContent=d.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'});
  const box=$('#dayItems'); box.innerHTML='';
  const t=tasks().filter(x=>x.due===selected), e=EVENTS.filter(x=>x.date===selected);
  if(!t.length&&!e.length) box.innerHTML='<div class="empty">Nothing due. Free day, or a chance to work ahead.</div>';
  t.forEach(x=>box.appendChild(itemButton(x,false)));
  e.forEach(x=>box.appendChild(itemButton(x,true)));
  const any=$('#anytime'); any.innerHTML='';
  const a=tasks().filter(x=>!x.due).sort((p,q)=>isDone(p)-isDone(q));
  if(!a.length) any.innerHTML='<div class="empty">None.</div>';
  a.forEach(x=>any.appendChild(itemButton(x,false)));
}

function renderList(){
  const all=tasks(), box=$('#groups'); box.innerHTML='';
  const open=all.filter(t=>!isDone(t));
  const byDate=(a,b)=>pd(a.due)-pd(b.due);
  const groups=[
    ['Overdue', open.filter(isLate).sort(byDate), 'late'],
    ['This week', open.filter(t=>t.due&&daysUntil(t.due)>=0&&daysUntil(t.due)<=7).sort(byDate)],
    ['Coming up', open.filter(t=>t.due&&daysUntil(t.due)>7).sort(byDate)],
    ['Anytime', open.filter(t=>!t.due)],
    ['Completed', all.filter(isDone).sort((a,b)=>(st(b.id).at||'').localeCompare(st(a.id).at||'')), 'done']
  ];
  groups.forEach(([name,list,cls])=>{
    const g=document.createElement('div'); g.className='group'+(cls?' '+cls:'');
    g.innerHTML='<h3>'+name+' <span class="n">'+list.length+'</span></h3>';
    const items=document.createElement('div'); items.className='items';
    if(!list.length) items.innerHTML='<div class="empty">'+(name==='Overdue'?'Nothing overdue. Nice!':'Nothing here.')+'</div>';
    list.forEach(t=>items.appendChild(itemButton(t,false)));
    g.appendChild(items); box.appendChild(g);
  });
}

/* ---------- Materials tab: everything teachers posted, newest first ---------- */
const MAT_KEY=KEY+'-mat';
let matPref={subject:'all', sort:'posted', dir:-1};
try{ Object.assign(matPref, JSON.parse(localStorage.getItem(MAT_KEY)||'{}')); }catch(e){}
function materials(){ return (typeof MATERIALS!=='undefined' && Array.isArray(MATERIALS)) ? MATERIALS : []; }
// series:'sketch' → the next unfinished task of sketch1, sketch2, … (or the last one when all are done)
function nextInSeries(list,pre){
  const ser=list.filter(x=>x.id.startsWith(pre)&&/^\d+$/.test(x.id.slice(pre.length))).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  return ser.find(x=>!isDone(x))||ser[ser.length-1]||null;
}
function renderMaterials(){
  const all=materials(), sel=$('#matSubject'), body=$('#matBody');
  const name=s=>(SUBJECTS[s]||{name:s}).name;
  const counts={}; all.forEach(m=>counts[m.subject]=(counts[m.subject]||0)+1);
  const subs=Object.keys(SUBJECTS).filter(k=>counts[k]).concat(Object.keys(counts).filter(k=>!SUBJECTS[k]));
  if(matPref.subject!=='all' && !counts[matPref.subject]) matPref.subject='all';
  sel.innerHTML='<option value="all">All subjects ('+all.length+')</option>'+subs.map(k=>'<option value="'+esc(k)+'">'+esc(name(k))+' ('+counts[k]+')</option>').join('');
  sel.value=matPref.subject;
  const list=tasks();
  const rows=all.filter(m=>matPref.subject==='all'||m.subject===matPref.subject).map(m=>{
    const t=m.task?list.find(x=>x.id===m.task):m.series?nextInSeries(list,m.series):null;
    const e=!t&&m.event&&typeof EVENTS!=='undefined'?EVENTS.find(x=>x.id===m.event):null;
    return {m,t,e,when:t?t.due:(e?e.date:null)};
  });
  const k=matPref.sort, d=matPref.dir;
  const newest=(a,b)=>(b.m.posted||'').localeCompare(a.m.posted||'')||a.m.title.localeCompare(b.m.title);
  const by={posted:(a,b)=>(a.m.posted||'').localeCompare(b.m.posted||''),
            title:(a,b)=>a.m.title.localeCompare(b.m.title,'en',{sensitivity:'base'}),
            subject:(a,b)=>name(a.m.subject).localeCompare(name(b.m.subject)),
            due:(a,b)=>a.when.localeCompare(b.when)};
  rows.sort((a,b)=>{
    if(k==='due' && (!a.when||!b.when)) return (!a.when)-(!b.when)||newest(a,b); // no date: always last
    return d*(by[k]||by.posted)(a,b)||newest(a,b);
  });
  document.querySelectorAll('#view-materials th[data-sort]').forEach(th=>{
    const on=th.dataset.sort===k;
    if(on) th.setAttribute('aria-sort',d>0?'ascending':'descending'); else th.removeAttribute('aria-sort');
    th.querySelector('.arr').textContent=on?(d>0?'▲':'▼'):'';
  });
  $('#matCount').textContent=rows.length+(rows.length===1?' item':' items')+' · tap a column to sort';
  if(!rows.length){ body.innerHTML='<tr><td colspan="4" class="empty">No materials yet.</td></tr>'; return; }
  body.innerHTML=rows.map(({m,t,e})=>{
    const files=(m.files||[]).map(f=>'<a class="mat-file" href="'+esc(f.url)+'" target="_blank" rel="noopener"><span class="kind">'+esc(f.kind||'LINK')+'</span><span>'+esc(f.label)+'</span></a>').join('');
    let forHtml='<span class="mat-none">—</span>';
    if(t){ const c=countdown(t);
      forHtml='<button type="button" class="mat-link" data-task="'+esc(t.id)+'">'+esc(t.title)+'</button><span class="mat-due">'+(t.due?'Due '+esc(fmt(t.due)):'No due date')+'</span>'+((t.due||isDone(t))?'<span class="count '+c.cls+'">'+esc(c.txt)+'</span>':''); }
    else if(e){ const n=daysUntil(e.date);
      forHtml='<button type="button" class="mat-link" data-event="'+esc(e.id)+'">'+esc(e.title)+'</button><span class="mat-due">Event · '+esc(fmt(e.date))+'</span>'+(n<0?'<span class="count">Past</span>':n<=7?'<span class="count soon">'+(n===0?'Today':n===1?'Tomorrow':n+' days')+'</span>':''); }
    return '<tr style="--c:'+col(m.subject)+'"><td class="mat-posted">'+esc(fmt(m.posted,{month:'short',day:'numeric'}))+'</td>'+
      '<td><a class="mat-title" href="'+esc(m.post)+'" target="_blank" rel="noopener">'+esc(m.title)+'</a>'+(files?'<div class="mat-files">'+files+'</div>':'')+'</td>'+
      '<td><span class="mat-subj"><i></i>'+esc(name(m.subject))+'</span>'+(m.teacher?'<div class="mat-teacher">'+esc(m.teacher)+'</div>':'')+'</td>'+
      '<td><div class="mat-for">'+forHtml+'</div></td></tr>';
  }).join('');
  body.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>openTask(b.dataset.task));
  body.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{ const ev=EVENTS.find(x=>x.id===b.dataset.event); if(ev) openEvent(ev); });
}
